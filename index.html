                console.log('레이어로 이동:', obj.position.longitude, obj.position.latitude, obj.position.altitude);
                let cenLon = obj.position.longitude;
                let cenLat = obj.position.latitude;
                let cenAlt = obj.position.altitude;
                Module.getViewCamera().move(new Module.JSVector3D(cenLon, cenLat, cenAlt + 1000), 89.9, 0, 0);
            } catch (e) {
                console.error('레이어 이동 오류:', e.message);
            }
        }
        // ECEF -> Geodetic (lat, lon, h), WGS84
        function ecefToLla(x, y, z) {
            const a = 6378137.0;                 // WGS84 semi-major
            const f = 1 / 298.257223563;         // flattening
            const e2 = f * (2 - f);              // first eccentricity^2

            const lon = Math.atan2(y, x);
            const p = Math.hypot(x, y);
            let lat = Math.atan2(z, p * (1 - e2));
            let N, h, latNew;

            for (let i = 0; i < 10; i++) {
                const sinLat = Math.sin(lat);
                N = a / Math.sqrt(1 - e2 * sinLat * sinLat);
                h = p / Math.cos(lat) - N;
                latNew = Math.atan2(z, p * (1 - e2 * N / (N + h)));
                if (Math.abs(lat - latNew) < 1e-12) { lat = latNew; break; }
                lat = latNew;
            }
            N = a / Math.sqrt(1 - e2 * Math.sin(lat) ** 2);
            h = p / Math.cos(lat) - N;

            return {
                latDeg: lat * 180 / Math.PI,
                lonDeg: lon * 180 / Math.PI,
                h
            };
        }
        // opts.meta        : layer.meta 파일 대신 쓸 메타 객체
        // opts.pathOverride: 엔진에 넘길 layerPath (로컬 HTTP URL 등)
        // opts.keepCamera  : true면 레이어 중심으로 카메라를 옮기지 않음 (전구 범위 DEM 등)
        // opts.demSourceId : 지형(sdb) 소스 id — DEM 배율(set-dem-scale) 대상
        function loadMetaLayer(filePath, opts = {}) {
            const source = opts.meta
                ? Promise.resolve(JSON.stringify(opts.meta))
                : window.electronAPI.readMeta(filePath);
            source
                .then(async (data) => {
                    try {

                        const jsonData = JSON.parse(data);
                        const layerName = jsonData['name'];
                        let layerPath = jsonData['path'];
                        const layerType = jsonData['type'];

                        // 경로 검증은 "폴더 존재"가 아니라 "타일 레벨 폴더 존재"로 한다.
                        // (ETLT_BASE_IMAGE의 layer.meta는 path가 상위 폴더를 가리키는 경우가 있는데,
                        //  상위 폴더는 존재하므로 단순 존재 검사로는 걸러지지 않는다)
                        const metaDir = filePath.substring(0, filePath.lastIndexOf(filePath.includes('\\') ? '\\' : '/'));
                        const hasTiles = (p) => p && window.electronAPI.pathExists(p + '/' + jsonData['level']['min']);

                        // 엔진이 HTTP로 타일을 요청하도록 layerPath를 대체하는 경우 경로 검증은 건너뛴다
                        if (opts.pathOverride) layerPath = opts.pathOverride;

                        if (!/^https?:\/\//i.test(layerPath) && !hasTiles(layerPath)) {
                            if (hasTiles(metaDir)) {
                                // meta.path가 상위 폴더를 가리키는 경우 (ETLT_BASE_IMAGE에서 관측됨)
                                console.warn(`layer.meta의 path에 타일이 없어 layer.meta 폴더를 사용합니다.\n  meta.path: ${layerPath}\n  사용: ${metaDir}`);
                                layerPath = metaDir;
                            } else if (!layerPath || !window.electronAPI.pathExists(layerPath)) {
                                const reason = layerPath && layerPath.startsWith('/')
                                    ? 'Windows 경로가 아닙니다'
                                    : '경로를 찾을 수 없습니다';
                                if (!confirm(`${reason}.\n\n경로: ${layerPath}\n\nlayer.meta 파일 폴더 기준 경로로 시도할까요?\n\n${metaDir}`)) {
                                    return;
                                }
                                if (!window.electronAPI.pathExists(metaDir)) {
                                    alert(`대체 경로도 찾을 수 없습니다.\n\n경로: ${metaDir}`);
                                    return;
                                }
                                layerPath = metaDir;
                            }
                            // 경로는 있으나 레벨 폴더가 없는 경우(DEM 등 다른 구조)는 그대로 둔다
                        }
                        const minLon = jsonData['area']['min']['lon'];
                        const maxLon = jsonData['area']['max']['lon'];
                        const minLat = jsonData['area']['min']['lat'];
                        const maxLat = jsonData['area']['max']['lat'];
                        const minLv = jsonData['level']['min'];
                        const maxLv = jsonData['level']['max'];
                        let cenLon = (minLon + maxLon) / 2;
                        let cenLat = (minLat + maxLat) / 2;
                        let alt = 1000;
                        let layer = null;
                        let layerList = new Module.JSLayerList(false);
                        let type = null;
                        if (layerType == "ETLT_PNG_IMAGE" || layerType == "ETLT_BASE_IMAGE") {
                            // 엔진에 영상 타일 타입은 TILE_LAYER_TYPE_IMAGE 하나뿐이다.
                            // ETLT_BASE_IMAGE(jpg + png 알파마스크)도 동일하게 처리한다.
                            type = Module.TILE_LAYER_TYPE_IMAGE;
                            alt = 5000;
                        }
                        else if(layerType == "ETLT_TERRAIN_IMAGE"){
                            type = Module.ELT_TERRAIN_IMAGE;
                            alt = 5000;
                        }
                        else if (layerType == "ETLT_VECTOR_PIPE") {
                            type = Module.TILE_LAYER_TYPE_VECTOR_PIPE;
                            alt = 500;
                        }else if (layerType == "ETLT_POINT_CLOUD") {
                            type = 19;
                            alt = 500;
                        }else if (layerType == "ETLT_REAL3D") {
                            type = Module.TILE_LAYER_TYPE_REAL3D;
                        }else if (layerType == "ETLT_BASE_DEM") {
                            // DEM은 항상 로컬 서버(/__xddem__/)를 거치게 한다: 배율(수직 과장)·빠진 타일 합성이 거기서 된다
                            const demBounds = [minLon, minLat, maxLon, maxLat];
                            if (opts.demSourceId) {
                                activeDemSource = { id: opts.demSourceId, name: layerName, bounds: demBounds, minL: minLv, maxL: maxLv };
                            } else if (!/^https?:\/\//i.test(layerPath)) {
                                const demSrc = await window.electronAPI.registerImageSource({ kind: 'demdir', srcDir: layerPath, maxLevel: maxLv, bounds: demBounds });
                                if (demSrc.error) {
                                    alert(`DEM 폴더를 열 수 없습니다.\n\n${layerPath}\n\n${demSrc.error}`);
                                    return;
                                }
                                activeDemSource = { id: demSrc.id, name: layerName, bounds: demBounds, minL: minLv, maxL: maxLv };
                                layerPath = demSrc.url;
                            } else {
                                activeDemSource = null; // 원격 DEM은 배율 불가
                            }
                            if (activeDemSource && currentDemScale !== 1) await window.electronAPI.setDemScale(activeDemSource.id, currentDemScale);

                            var terrain = Module.getTerrain();
                            terrain.SetUseDemBox(true);
                            terrain.setDemBox({
                                server: {
                                    url: layerPath,
                                    layer_name: layerName,
                                    format: "bil",
                                    request_type: "file",
                                },
                                area: {
                                    min: { lon: minLon, lat: minLat },
                                    max: { lon: maxLon, lat: maxLat }
                                }
                            });
                            Module.XDRenderData();
                            Module.XDEPlanetRefresh(); // demBox 교체를 지형에 반영 (카메라를 안 움직이면 이게 없으면 기존 지형이 그대로 남는다)
                            if (!opts.keepCamera) Module.getViewCamera().move(new Module.JSVector3D(cenLon, cenLat, alt), 89.9, 0, 0);

                            // 레이어 패널에 추가
                            const layerItem = document.createElement('div');
                            layerItem.className = 'layer-item';

                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.checked = true;
                            checkbox.addEventListener('change', () => {
                                terrain.SetUseDemBox(checkbox.checked);
                                Module.XDEPlanetRefresh();
                            });

                            const label = document.createElement('span');
                            label.textContent = layerName;
                            label.title = layerName;
                            label.style.cursor = 'pointer';
                            label.addEventListener('click', () => {
                                Module.getViewCamera().move(new Module.JSVector3D(cenLon, cenLat, 5000), 89.9, 0, 0);
                            });

                            const removeBtn = document.createElement('button');
                            removeBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
                            removeBtn.title = `${layerName} 레이어를 삭제합니다`;
                            removeBtn.addEventListener('click', () => {
                                terrain.SetUseDemBox(false);
                                Module.XDEPlanetRefresh();
                                activeDemSource = null;
                                removeDemColorLayer();
                                layerItem.remove();
                            });

                            layerItem.appendChild(checkbox);
                            layerItem.appendChild(makeLayerIcon('dem'));
                            layerItem.appendChild(label);
                            layerItem.appendChild(removeBtn);
                            document.getElementById('interface').appendChild(layerItem);
                            index++;
                            return;
                        }
                        if (layerType == "ETLT_3DPOINT") {
                            type = Module.TILE_LAYER_TYPE_POI;
                            // 아래 좌표는 테스트용입니다. 제주도 
                            cenLon = 126.852;
                            cenLat = 33.523;
                            alt = 500;
                        }
                        if (type === null) {
                            alert(`지원하지 않는 레이어 타입입니다: ${layerType}\n\n${filePath}`);
                            return;
                        }
                        Module.XDEMapCreateLayer(layerName, layerPath, 0, true, true, true, type, minLv, maxLv);
                        if (!opts.keepCamera) Module.getViewCamera().move(new Module.JSVector3D(cenLon, cenLat, alt), 89.9, 0, 0);
                        layer = layerList.nameAtLayer(layerName);

                        if (layer != null) {

                            const layerItem = document.createElement('div');
                            layerItem.className = 'layer-item';

                            // 체크박스
                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.checked = true;
                            checkbox.addEventListener('change', () => {
                                layer.setVisible(checkbox.checked);
                            });

                            // 레이어 이름
                            const label = document.createElement('span');
                            label.textContent = layerName;
                            label.title = layerName; // 마우스 오버 시 전체 이름 표시
                            label.style.cursor = 'pointer'; // 클릭 가능함을 표시
                            label.addEventListener('click', () => {
                                // 레이어 클릭시 동작
                                Module.getViewCamera().move(new Module.JSVector3D(cenLon, cenLat, 5000), 89.9, 0, 0);
                            });

                            // x 제거 버튼
                            const removeBtn = document.createElement('button');
                            removeBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
                            removeBtn.title = `${label.textContent} 레이어를 삭제합니다`;
                            removeBtn.addEventListener('click', () => {
                                Module.XDEMapRemoveLayer(label.textContent);
                                layerItem.remove();
                                mouseOverInterface(false);
                                if (layerType == "ETLT_VECTOR_PIPE") {
                                    Module.XDESetPlanetTransparecny(0.0);
                                }
                            });

                            // 조립
                            layerItem.appendChild(checkbox);
                            layerItem.appendChild(makeLayerIcon(jsonData.iconKind || LAYER_TYPE_ICON[layerType] || 'imagery'));
                            layerItem.appendChild(label);

                            if (layerType == "ETLT_VECTOR_PIPE") {
                                const transparencyBtn = document.createElement('button');
                                transparencyBtn.textContent = 'T';
                                let isTransparent = false;
                                transparencyBtn.addEventListener('click', () => {
                                    isTransparent = !isTransparent;
                                    Module.XDESetPlanetTransparecny(isTransparent ? 0.25 : 1.0);
                                });
                                layerItem.appendChild(transparencyBtn);
                            }

                            layerItem.appendChild(removeBtn);

                            // 컨텍스트 메뉴 추가
                            layerItem.addEventListener('contextmenu', (e) => {
                                e.preventDefault();
                                e.stopPropagation();

                                window.currentContextLayer = {
                                    layerItem: layerItem,
                                    layer: layer,
                                    label: label,
                                    removeBtn: removeBtn
                                };

                                showContextMenu(e, layerItem);
                            });

                            // 드래그 앤 드롭 가능하게 설정
                            makeDraggable(layerItem, layer, layerList);

                            document.getElementById('interface').appendChild(layerItem);
                            index++;
                        }
                    } catch (e) {
                        console.error("Failed to parse .meta file as JSON:", e);
                        alert(".meta 파일을 JSON으로 파싱하는데 실패했습니다.");
                    }
                })
                .catch(err => {
                    console.error("Failed to read .meta file:", err);
                    alert(".meta 파일을 읽는데 실패했습니다.");
                });
        }



    </script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.11.0/sql-wasm.js"></script>
</body>
