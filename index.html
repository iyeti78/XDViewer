<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XDViewer</title>
    <link rel="stylesheet" href="style.css"> <!-- 외부 CSS 파일 연결 -->
</head>

<body>
    <!-- 로딩 화면 -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">
                <h1>XDViewer</h1>
                <p>3D 지도 엔진 로딩중...</p>
            </div>
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
            <div class="loading-text">잠시만 기다려 주세요</div>
        </div>
    </div>

    <!-- 지도 표시 영역 -->
    <div id='map'></div>

    <!-- 파일 드래그 오버레이 -->
    <div id="dropOverlay">
        <div class="drop-overlay-content">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 16V8M12 8L9 11M12 8L15 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 15V17C3 18.1046 3.89543 19 5 19H19C20.1046 19 21 18.1046 21 17V15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>파일을 놓아 불러오기</span>
        </div>
    </div>

    <!-- 지형 렌더링 범례 오버레이 -->
    <div id="terrainLegend" style="display:none; position:fixed; left:16px; bottom:16px; z-index:1500; background:rgba(18,18,18,0.75); border-radius:6px; padding:8px 10px; backdrop-filter:blur(4px); flex-direction:column; align-items:flex-start; gap:6px;">
        <div id="legendTitle" style="font-size:11px; color:#aaa; white-space:nowrap; align-self:center;"></div>
        <div id="legendItems" style="display:flex; flex-direction:column; gap:2px;"></div>
    </div>

    <!-- 지도 컨트롤 버튼 -->
    <div id="map-controls">
        <button id="btnReload" class="map-control-btn" title="새로고침: 카메라는 그대로 두고 지형·영상 타일을 다시 그림 (XDEPlanetRefresh)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 3.5v3.5h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3.6 7A5 5 0 0 1 13 8a5 5 0 0 1-8.7 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="8" cy="8" r="1.2" fill="currentColor"/>
            </svg>
        </button>
        <button id="btnResetView" class="map-control-btn" title="초기화">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 8a6 6 0 0 1 10.47-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M14 8a6 6 0 0 1-10.47 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M13 1.5V4.5H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 14.5V11.5H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button id="btnNorthView" class="map-control-btn" title="정북방향">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <text x="10" y="7.5" text-anchor="middle" font-size="8" font-weight="bold" fill="#e05050" font-family="Arial,sans-serif">N</text>
                <path d="M10 9L7.5 16h5L10 9z" fill="currentColor" opacity="0.4"/>
                <line id="horizonLine" x1="2" y1="10" x2="18" y2="10" stroke="currentColor" stroke-width="1" opacity="0.5"/>
            </svg>
        </button>
    </div>

    <!-- 그림자 시뮬레이션 패널 -->
    <div id="shadow-panel" class="floating-panel" style="display:none;">
        <div class="floating-panel-header">
            <span>그림자 시뮬레이션</span>
            <button id="shadowPanelClose" class="floating-panel-close">&times;</button>
        </div>
        <div class="floating-panel-body">
            <!-- 모드 선택 -->
            <div class="fp-mode-tabs">
                <button class="fp-mode-tab active" data-mode="fixed">고정 시간</button>
                <button class="fp-mode-tab" data-mode="simulation">시뮬레이션</button>
            </div>

            <!-- 공통: 날짜 -->
            <div class="fp-row">
                <label class="fp-label">날짜</label>
                <div class="fp-inputs">
                    <select id="SE_Year" class="fp-select fp-select-year"></select><span class="fp-unit">년</span>
                    <select id="SE_Month" class="fp-select fp-select-sm"></select><span class="fp-unit">월</span>
                    <select id="SE_Day" class="fp-select fp-select-sm"></select><span class="fp-unit">일</span>
                </div>
            </div>

            <!-- 고정 시간 모드 -->
            <div id="shadowFixedMode">
                <div class="fp-row">
                    <label class="fp-label">표시 모드</label>
                    <div class="fp-inputs">
                        <select id="SE_DrawMode" class="fp-select" style="min-width:100px;">
                            <option value="1" selected>기본</option>                            
                            <option value="3">선</option>
                            <option value="4">면</option>                            
                        </select>
                    </div>
                </div>
                <div class="fp-row">
                    <label class="fp-label">시간</label>
                    <div class="fp-inputs">
                        <select id="SE_FixedHour" class="fp-select"></select><span class="fp-unit">시</span>
                        <select id="SE_FixedMinute" class="fp-select"></select><span class="fp-unit">분</span>
                    </div>
                </div>
                <div class="fp-actions">
                    <button id="shadowApplyBtn" class="fp-btn fp-btn-primary">적용</button>
                    <button id="shadowClearBtn" class="fp-btn fp-btn-secondary">지우기</button>
                </div>
            </div>

            <!-- 시뮬레이션 모드 -->
            <div id="shadowSimMode" style="display:none;">
                <div class="fp-row">
                    <label class="fp-label">시작 시간</label>
                    <div class="fp-inputs">
                        <select id="SE_StartHour" class="fp-select"></select><span class="fp-unit">시</span>
                        <select id="SE_StartMinute" class="fp-select"></select><span class="fp-unit">분</span>
                    </div>
                </div>
                <div class="fp-row">
                    <label class="fp-label">종료 시간</label>
                    <div class="fp-inputs">
                        <select id="SE_StopHour" class="fp-select"></select><span class="fp-unit">시</span>
                        <select id="SE_StopMinute" class="fp-select"></select><span class="fp-unit">분</span>
                    </div>
                </div>
                <div class="fp-row">
                    <label class="fp-label">시간 간격</label>
                    <div class="fp-inputs">
                        <select id="SE_TimeTerm" class="fp-select"></select><span class="fp-unit">분</span>
                    </div>
                </div>
                <div class="fp-actions">
                    <button id="shadowPlayBtn" class="fp-btn fp-btn-primary">재생</button>
                    <button id="shadowStopBtn" class="fp-btn fp-btn-secondary">정지</button>
                </div>
            </div>
        </div>
    </div>

    <!-- VSCode 스타일 사이드바 -->
    <div id="sidebar">
        <!-- 탭 바 -->
        <div id="tabbar" class="transparent">
            <button class="tab-button" data-tab="layers" title="레이어">
                ☰
            </button>
            <button class="tab-button" data-tab="settings" title="설정">
                ⚙
            </button>
            <button class="tab-button" data-tab="analysis" title="분석">
                △
            </button>
            <button class="tab-button" data-tab="info" title="정보">
                ⓘ
            </button>
            <div style="flex:1"></div>
            <button class="tab-button" id="dbTabButton" title="데이터베이스">
                ⊞
            </button>
        </div>

        <!-- 사이드바 패널 -->
        <div id="sidebar-panel" class="collapsed" onmouseout="mouseOverInterface(false);"
            onmouseover="mouseOverInterface(true);">
            <!-- 레이어 패널 -->
            <div id="layers-panel" class="panel active">
                <div class="panel-header">
                    <span>레이어</span>
                    <button id="openLayer">+</button>
                </div>
                <div class="panel-content">
                    <!-- 경로/URL로 레이어 추가 (드롭 대신 텍스트) -->
                    <div style="display:flex; gap:4px; padding:6px 8px;">
                        <input type="text" id="tilesetUrlInput" placeholder="경로 또는 URL 붙여넣기 (tileset.json · layer.meta · .geojson · .gpkg · 폴더)"
                            style="flex:1; min-width:0; padding:4px 6px; font-size:12px; background:#2a2a2a; color:#eee; border:1px solid #444; border-radius:4px;" />
                        <button id="addUrlBtn" title="경로/URL로 레이어 추가"
                            style="padding:4px 8px; font-size:12px; cursor:pointer;">추가</button>
                    </div>
                    <!-- 레이어 아이템들이 추가될 영역 -->
                    <div id="interface"></div>
                </div>
            </div>

            <!-- 설정 패널 -->
            <div id="settings-panel" class="panel">
                <div class="panel-header">
                    <span>설정</span>
                </div>
                <div class="panel-content settings-content">
                    <div class="settings-section">
                        <div class="settings-label">배경지도</div>
                        <select id="basemapSelect" class="settings-select">
                            <option value="0">기본 (VWorld)</option>
                            <option value="1">Google (일반)</option>
                            <option value="2">Google (지형)</option>
                            <option value="3">Google (벡터 하이브리드)</option>
                            <option value="4">Google (위성 하이브리드)</option>
                            <option value="5">Google (위성)</option>
                            <option value="6">ArcMap (일반)</option>
                            <option value="7">ArcMap (지형)</option>
                            <option value="8">ArcMap (벡터 하이브리드)</option>
                            <option value="9">ArcMap (위성)</option>
                            <option value="10">OpenStreetMap</option>
                            <option value="11">초기화</option>
                        </select>
                    </div>
                    <div class="settings-section">
                        <div class="settings-label">이미지 품질</div>
                        <select id="basemapQuality" class="settings-select">
                            <option value="low">낮음</option>
                            <option value="middle" selected>보통</option>
                            <option value="high">높음</option>
                        </select>
                    </div>
                    <div class="settings-section">
                        <label class="settings-checkbox-label">
                            <input type="checkbox" id="buildingToggle">
                            <span>건물 표시</span>
                        </label>
                        <div class="settings-sub-options" id="buildingOptions">
                            <div class="settings-sub-row">
                                <span class="settings-sub-label">심플모드</span>
                                <label class="settings-toggle-label">
                                    <input type="checkbox" id="simpleModeToggle" checked>
                                    <span class="toggle-text" id="simpleModeText">ON</span>
                                </label>
                            </div>
                            <div class="settings-sub-row">
                                <span class="settings-sub-label">렌더링 모드</span>
                                <div class="settings-radio-group">
                                    <label class="settings-radio-label">
                                        <input type="radio" name="renderMode" value="1">
                                        <span>Normal</span>
                                    </label>
                                    <label class="settings-radio-label">
                                        <input type="radio" name="renderMode" value="2" checked>
                                        <span>Gradient</span>
                                    </label>
                                </div>
                            </div>
                            <div class="settings-sub-row">
                                <span class="settings-sub-label">엣지 렌더링</span>
                                <div class="settings-radio-group">
                                    <label class="settings-radio-label">
                                        <input type="radio" name="edgeRender" value="true">
                                        <span>Enable</span>
                                    </label>
                                    <label class="settings-radio-label">
                                        <input type="radio" name="edgeRender" value="false" checked>
                                        <span>Disable</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 분석 패널 -->
            <div id="analysis-panel" class="panel">
                <div class="panel-header">
                    <span>분석</span>
                </div>
                <div class="panel-content settings-content">
                    <div class="settings-section">
                        <div class="settings-label" style="color:#fff;font-size:13px;">지형 렌더링</div>
                        <div class="settings-radio-group">
                            <label class="settings-radio-label">
                                <input type="radio" name="terrainRenderMode" value="0" checked>
                                <span>Normal</span>
                            </label>
                            <label class="settings-radio-label">
                                <input type="radio" name="terrainRenderMode" value="10">
                                <span>Slope</span>
                            </label>
                            <label class="settings-radio-label">
                                <input type="radio" name="terrainRenderMode" value="11">
                                <span>Aspect</span>
                            </label>
                            <label class="settings-radio-label">
                                <input type="radio" name="terrainRenderMode" value="1">
                                <span>고도 색상</span>
                            </label>
                        </div>
                        <!-- 고도 색상: setTerrainEffect(1) + setTerrainColor. 음수(수심)도 받는다 -->
                        <div id="terrainColorOptions">
                            <div class="row">
                                <span class="settings-label">범위</span>
                                <input type="number" id="terrainColorMin" class="settings-number" value="-6000" step="100" title="최소 고도(m). 수심은 음수">
                                <span class="unit">~</span>
                                <input type="number" id="terrainColorMax" class="settings-number" value="4000" step="100" title="최대 고도(m)">
                                <span class="unit">m</span>
                            </div>
                            <div class="row">
                                <span class="settings-label">색상</span>
                                <select id="terrainColorTheme" class="settings-select" style="flex:1;" title="지형·수심: 해면 0m 기준으로 바다/육지 색이 나뉨 · 범용: 범위 전체에 균등">
                                    <optgroup label="지형·수심 (해면 기준)">
                                        <option value="natural" selected>자연색 지형 (NASA 스타일)</option>
                                        <option value="etopo1">ETOPO1 (GMT / NOAA)</option>
                                        <option value="relief">GMT relief</option>
                                        <option value="topo">cmocean topo</option>
                                        <option value="globe">GMT globe</option>
                                    </optgroup>
                                    <optgroup label="범용">
                                        <option value="terrain">matplotlib terrain</option>
                                        <option value="viridis">viridis</option>
                                        <option value="turbo">turbo</option>
                                        <option value="gray">grayscale</option>
                                    </optgroup>
                                    <optgroup label="XDWorld Terrain Altitude Color">
                                        <option value="xd_standard">Standard</option>
                                        <option value="xd_warm">Warm</option>
                                        <option value="xd_sea">Sea</option>
                                        <option value="xd_plant">Plant</option>
                                        <option value="xd_sky">Sky</option>
                                    </optgroup>
                                </select>
                            </div>
                            <div class="row">
                                <span class="settings-label">단계</span>
                                <select id="terrainColorSteps" class="settings-select" style="flex:1;" title="색 구간 수(최대 32, 엔진 제한). 구간별 단색으로 칠하므로 적을수록 등고선처럼 끊어져 보임">
                                    <option value="8">8</option>
                                    <option value="12">12</option>
                                    <option value="16">16</option>
                                    <option value="24">24</option>
                                    <option value="32" selected>32 (최대)</option>
                                </select>
                            </div>
                            <div class="row" title="엔진 지형 색상은 32색 구간 단색이라 띠가 생김. 켜면 DEM에서 연속 그라데이션+힐셰이드 영상 타일을 만들어 지형 위에 덮는다 (드롭한 DEM에만)">
                                <label class="settings-checkbox-label" style="gap:6px;">
                                    <input type="checkbox" id="terrainColorSmooth">
                                    <span>부드러운 색 (DEM 영상으로 덮기)</span>
                                </label>
                                <select id="terrainColorShade" class="settings-select" style="width:auto;" title="힐셰이드 강도(높이 배율)">
                                    <option value="0">음영 없음</option>
                                    <option value="1">음영 1×</option>
                                    <option value="3" selected>음영 3×</option>
                                    <option value="6">음영 6×</option>
                                    <option value="10">음영 10×</option>
                                </select>
                            </div>
                            <div class="row">
                                <span class="settings-label">불투명</span>
                                <input type="range" id="terrainColorOpacity" min="0" max="1" step="0.1" value="1" style="flex:1;">
                                <span id="terrainColorOpacityText" class="unit" style="min-width:22px;text-align:right;">1.0</span>
                            </div>
                        </div>
                        <!-- DEM 배율(수직 과장): 드롭한 DEM 타일의 높이값에 서버가 배율을 곱해 응답. 기본 VWorld 지형은 엔진 제약으로 불가 -->
                        <!-- DEM 메시 업샘플(3차 보간): 최대 레벨 위 3레벨을 부드럽게. 전/후 비교용 체크박스 -->
                        <label class="settings-checkbox-label" style="margin-top:10px; gap:6px;" title="DEM 최대 레벨 위 3레벨을 3차 보간으로 촘촘히 만들어 삼각형 면이 안 보이게. 끄면 원 해상도 격자 그대로(비교용)">
                            <input type="checkbox" id="demSmoothToggle" checked>
                            <span>DEM 메시 부드럽게 (3차 보간 업샘플)</span>
                        </label>
                        <!-- 타일 LOD 비율: Module.getMap().setTerrLODRatio. 올리면 같은 거리에서 더 상세한 레벨의 지형·영상 타일을 요청(타일 수 증가) -->
                        <div style="display:flex; align-items:center; gap:6px; margin-top:10px;" title="타일 LOD 비율(엔진 setTerrLODRatio). 올리면 같은 거리에서 한두 레벨 더 상세한 타일을 가져와 메시·영상이 촘촘해짐. 타일 요청 수가 늘어 느려질 수 있음">
                            <span class="settings-label" style="margin:0; min-width:48px;">타일 비율</span>
                            <input type="range" id="tileRatioSlider" min="1" max="4" step="0.5" value="1" style="flex:1;">
                            <span id="tileRatioText" style="color:#cccccc; font-size:11px; min-width:34px; text-align:right;">1.0×</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px; margin-top:10px;" title="드롭한 지형(DEM)의 높이를 몇 배로 과장할지. 해저 골짜기나 산의 계곡이 잘 보이게. 기본 지형에는 적용되지 않음">
                            <span class="settings-label" style="margin:0; min-width:48px;">DEM 배율</span>
                            <input type="range" id="demRateSlider" min="1" max="10" step="0.5" value="1" style="flex:1;">
                            <span id="demRateText" style="color:#cccccc; font-size:11px; min-width:34px; text-align:right;">1.0×</span>
                        </div>
                    </div>
                    <div class="settings-section">
                        <label class="settings-checkbox-label">
                            <input type="checkbox" id="terrainSliceToggle">
                            <span>지형단면도</span>
                        </label>
                    </div>
                    <div class="settings-section">
                        <label class="settings-checkbox-label">
                            <input type="checkbox" id="shadowToggle">
                            <span>그림자 시뮬레이션</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 정보 패널 -->
            <div id="info-panel" class="panel">
                <div class="panel-header">
                    <span>정보</span>
                </div>
                <div class="panel-content info-content">
                    <div class="info-section">
                        <div class="info-logo">XDViewer</div>
                        <div class="info-version" id="app-version">v0.0.0</div>
                        <div class="info-description">Digital Twin Viewer</div>
                    </div>
                    <div class="info-section">
                        <div class="info-label">Developer</div>
                        <div class="info-value">EGIS Co., Ltd.</div>
                    </div>
                    <div class="info-section">
                        <a href="#" id="github-link" class="info-link" title="GitHub 저장소 열기">
                            <span class="github-icon">⬡</span>
                            <span>GitHub</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="geojsonLayerList" class="layerlist" style="margin-bottom: 10px;"></div>

    <!-- 컨텍스트 메뉴 (동적으로 생성) -->
    <div id="contextMenu" class="context-menu" style="display: none;">
    </div>

    <!-- CSV 컬럼 선택 모달 -->
    <div id="csvModal" class="csv-modal-overlay" style="display: none;">
        <div class="csv-modal">
            <div class="csv-modal-header">
                <span>CSV 컬럼 설정</span>
                <button id="csvModalClose" class="close-properties-btn">×</button>
            </div>
            <div class="csv-modal-body">
                <div class="csv-modal-info" id="csvModalInfo"></div>
                <div class="csv-modal-row">
                    <label>경도 (Longitude)</label>
                    <select id="csvColLon"></select>

                <div class="csv-modal-row">
