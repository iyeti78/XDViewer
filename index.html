    <!-- 하단 패널 리사이즈 핸들 -->
    <div id="bottom-panel-resizer"></div>

    <!-- 하단 패널 (SQL 데이터 뷰어) -->
    <div id="bottom-panel" onmouseover="mouseOverInterface(true);" onmouseout="mouseOverInterface(false);">
        <div id="bottom-panel-header">
            <div id="bottom-panel-tabs">
                <span class="bottom-panel-tab active" id="bottomTabSQL">SQL</span>
                <span class="bottom-panel-tab" id="bottomTabSlice">지형단면도</span>
                <select id="sqlTableSelect" title="테이블 선택">
                    <option value="">테이블 선택...</option>
                </select>
            </div>
            <div id="bottom-panel-actions">
                <span id="sqlStatus"></span>
                <span id="terrainSliceStatus" style="display:none;font-size:11px;color:#aaa;"></span>
                <button id="terrainSliceClearBtn" style="display:none;" class="csv-btn csv-btn-cancel">지우기</button>
                <button id="bottomPanelClose" title="닫기">&times;</button>
            </div>
        </div>
        <div id="bottom-panel-content">
            <div id="sql-panel-area">
                <div id="sql-query-area">
                    <textarea id="sqlInput" placeholder="SELECT * FROM tablename LIMIT 100" spellcheck="false"></textarea>
                    <button id="sqlRunBtn" class="csv-btn csv-btn-ok" title="Ctrl+Enter">실행</button>
                </div>
                <div id="sql-results-area">
                    <table id="sqlResultsTable">
                        <thead id="sqlResultsHead"></thead>
                        <tbody id="sqlResultsBody"></tbody>
                    </table>
                </div>
                <div id="sqlResultsInfo"></div>
            </div>
            <div id="terrain-slice-area" style="display:none;flex:1;padding:8px;overflow:hidden;">
                <canvas id="terrainSliceChart" height="0" style="display:block;width:100%;"></canvas>
            </div>
        </div>
    </div>

    <script>
        index = 0;

        // ============ SQLite 데이터베이스 관리 ============
        let sqlDb = null;
        let sqlReady = false;
        const sqlTableMap = {};

        async function initSqlite() {
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.11.0/${file}`
                });
                sqlDb = new SQL.Database();
                sqlReady = true;
                console.log('SQLite 초기화 완료');
            } catch (err) {
                console.error('SQLite 초기화 실패:', err);
            }
        }

        function sanitizeTableName(name) {
            let safe = name.replace(/[^a-zA-Z0-9가-힣_]/g, '_').replace(/^[0-9]/, '_$&');
            // 테이블명 중복 시 접미사 추가
            if (sqlTableMap[safe]) {
                let i = 2;
                while (sqlTableMap[safe + '_' + i]) i++;
                safe = safe + '_' + i;
            }
            return safe || 'table_' + Date.now();
        }

        function importCsvToSqlite(tableName, headers, rows) {
            if (!sqlDb || !sqlReady) return null;

            const safeName = sanitizeTableName(tableName);
            const safeHeaders = headers.map((h, i) => {
                const safe = h.replace(/[^a-zA-Z0-9가-힣_]/g, '_').replace(/^[0-9]/, '_$&');
                return safe || 'col_' + i;
            });

            // 컬럼 타입 추론
            const types = safeHeaders.map((_, colIdx) => {
                let numCount = 0;
                const sampleSize = Math.min(20, rows.length);
                for (let i = 0; i < sampleSize; i++) {
                    const val = rows[i] && rows[i][colIdx];
                    if (val !== undefined && val !== '' && !isNaN(Number(val))) numCount++;
                }
                return (sampleSize > 0 && numCount / sampleSize >= 0.8) ? 'REAL' : 'TEXT';
            });

            const colDefs = safeHeaders.map((h, i) => `"${h}" ${types[i]}`).join(', ');
            sqlDb.run(`DROP TABLE IF EXISTS "${safeName}"`);
            sqlDb.run(`CREATE TABLE "${safeName}" (${colDefs})`);

            const placeholders = safeHeaders.map(() => '?').join(', ');
            const insertSql = `INSERT INTO "${safeName}" VALUES (${placeholders})`;

            sqlDb.run('BEGIN TRANSACTION');
            for (const row of rows) {
                const values = safeHeaders.map((_, i) => {
                    const val = row[i];
                    if (val === undefined || val === '') return null;
                    if (types[i] === 'REAL' && !isNaN(Number(val))) return Number(val);
                    return val;
                });
                sqlDb.run(insertSql, values);
            }
            sqlDb.run('COMMIT');

            sqlTableMap[safeName] = { originalName: tableName, rowCount: rows.length };
            updateTableSelect();
            console.log(`SQLite 테이블 "${safeName}" 생성: ${rows.length}행`);
            return safeName;
        }

        function importGeoJsonToSqlite(tableName, features) {
            if (!sqlDb || !sqlReady || !features || features.length === 0) return null;

            const safeName = sanitizeTableName(tableName);

            // 모든 feature의 properties 키 수집
            const propKeys = new Set();
            for (const f of features) {
                if (f.properties) Object.keys(f.properties).forEach(k => propKeys.add(k));
            }
            const propArray = Array.from(propKeys);

            // 특수 컬럼 + properties 컬럼
            const allCols = ['_id', '_geometry_type', '_longitude', '_latitude', ...propArray];
            const safeCols = allCols.map(h => h.replace(/[^a-zA-Z0-9가-힣_]/g, '_').replace(/^[0-9]/, '_$&'));

            // 타입 추론
            const types = allCols.map((col, idx) => {
                if (idx <= 1) return 'TEXT'; // _id, _geometry_type
                if (idx <= 3) return 'REAL'; // _longitude, _latitude
                let numCount = 0;
                const sampleSize = Math.min(20, features.length);
                for (let i = 0; i < sampleSize; i++) {
                    const val = features[i].properties && features[i].properties[propArray[idx - 4]];
                    if (val !== undefined && val !== null && val !== '' && !isNaN(Number(val))) numCount++;
                }
                return (sampleSize > 0 && numCount / sampleSize >= 0.8) ? 'REAL' : 'TEXT';
            });

            const colDefs = safeCols.map((h, i) => `"${h}" ${types[i]}`).join(', ');
            sqlDb.run(`DROP TABLE IF EXISTS "${safeName}"`);
            sqlDb.run(`CREATE TABLE "${safeName}" (${colDefs})`);

            const placeholders = safeCols.map(() => '?').join(', ');
            const insertSql = `INSERT INTO "${safeName}" VALUES (${placeholders})`;

            sqlDb.run('BEGIN TRANSACTION');
            for (const f of features) {
                const geom = f.geometry;
                let lon = null, lat = null;
                if (geom && geom.coordinates) {
                    if (geom.type === 'Point') {
                        lon = geom.coordinates[0]; lat = geom.coordinates[1];
                    } else if (geom.type === 'LineString' || geom.type === 'MultiLineString') {
                        const coords = geom.type === 'LineString' ? geom.coordinates : geom.coordinates[0];
                        if (coords && coords.length > 0) { lon = coords[0][0]; lat = coords[0][1]; }
                    } else if (geom.type === 'Polygon' || geom.type === 'MultiPolygon') {
                        const ring = geom.type === 'Polygon' ? geom.coordinates[0] : geom.coordinates[0][0];
                        if (ring && ring.length > 0) { lon = ring[0][0]; lat = ring[0][1]; }
                    }
                }

                const values = [
                    f.id || f.properties?.id || null,
                    geom ? geom.type : null,
                    lon, lat,
                    ...propArray.map(k => {
                        const val = f.properties && f.properties[k];
                        if (val === undefined || val === null) return null;
                        return val;
                    })
                ];
                sqlDb.run(insertSql, values);
            }
            sqlDb.run('COMMIT');

            sqlTableMap[safeName] = { originalName: tableName, rowCount: features.length };
            updateTableSelect();
            console.log(`SQLite 테이블 "${safeName}" 생성: ${features.length}행`);
            return safeName;
        }

        function executeSqlQuery(sql) {
            if (!sqlDb || !sqlReady) return { error: 'SQLite가 초기화되지 않았습니다.' };
            try {
                const results = sqlDb.exec(sql);
                if (results.length === 0) return { columns: [], values: [], message: '결과 없음 (0행)' };
                return { columns: results[0].columns, values: results[0].values, message: `${results[0].values.length}행 반환` };
            } catch (err) {
                return { error: err.message };
            }
        }

        function findSqliteTable(name) {
            const safeName = name.replace(/[^a-zA-Z0-9가-힣_]/g, '_').replace(/^[0-9]/, '_$&');
            for (const key of Object.keys(sqlTableMap)) {
                if (key === safeName || sqlTableMap[key].originalName === name) return key;
            }
            return null;
        }

        function dropSqliteTable(tableName) {
            if (!sqlDb || !sqlReady) return;
            const key = findSqliteTable(tableName);
            if (key) {
                // 현재 표시 중인 테이블이면 결과 초기화
                const select = document.getElementById('sqlTableSelect');
                if (select && select.value === key) {
                    select.value = '';
                    document.getElementById('sqlInput').value = '';
                    document.getElementById('sqlResultsHead').innerHTML = '';
                    document.getElementById('sqlResultsBody').innerHTML = '';
                    document.getElementById('sqlResultsInfo').textContent = '';
                    document.getElementById('sqlStatus').textContent = '';
                    document.getElementById('sqlStatus').className = '';
                }

                sqlDb.run(`DROP TABLE IF EXISTS "${key}"`);
                delete sqlTableMap[key];
                updateTableSelect();

                // 테이블이 하나도 없으면 SQL 패널 닫기
                if (Object.keys(sqlTableMap).length === 0) {
                    sqlPanelOpen = false;
                    hideBottomPanel();
                }
            }
        }

        // ============ 하단 패널 (SQL 데이터 뷰어) ============
        let bottomPanelVisible = false;
        let bottomPanelHeight = 250;
        let sqlPanelOpen = false; // SQL 패널이 독립적으로 열려있는지

        function showBottomPanel() {
            document.getElementById('bottom-panel').classList.add('visible');
            document.getElementById('bottom-panel-resizer').classList.add('visible');
            bottomPanelVisible = true;
            updateMapSize();
        }

        function hideBottomPanel() {
            document.getElementById('bottom-panel').classList.remove('visible');
            document.getElementById('bottom-panel-resizer').classList.remove('visible');
            bottomPanelVisible = false;
            updateMapSize();
        }

        function updateMapSize() {
            const mapEl = document.getElementById('map');
            mapEl.style.height = '100%';
            if (bottomPanelVisible) {
                document.getElementById('bottom-panel').style.height = bottomPanelHeight + 'px';
                document.getElementById('bottom-panel-resizer').style.bottom = bottomPanelHeight + 'px';
            }
            if (typeof Module === 'object' && typeof Module.Resize === 'function') {
                Module.Resize(window.innerWidth, window.innerHeight);
                Module.XDRenderData();
            }
            if (window.window.terrainSliceChartObj) {
                window.window.terrainSliceChartObj.resize();
            }
            // 선택 패널 위치 조정
            const selPanel = document.getElementById('selection-panel');
            if (selPanel) {
                selPanel.style.bottom = bottomPanelVisible ? (bottomPanelHeight + 20) + 'px' : '20px';
            }
        }

        function updateTableSelect() {
            const select = document.getElementById('sqlTableSelect');
            if (!select) return;
            select.innerHTML = '<option value="">테이블 선택...</option>';
            for (const name of Object.keys(sqlTableMap)) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = `${sqlTableMap[name].originalName} (${sqlTableMap[name].rowCount}행)`;
                select.appendChild(opt);
            }
        }

        function runDefaultQuery(tableName) {
            const sql = `SELECT * FROM "${tableName}" LIMIT 100`;
            document.getElementById('sqlInput').value = sql;
            executeAndDisplayQuery(sql);
        }

        function executeAndDisplayQuery(sql) {
            const status = document.getElementById('sqlStatus');
            const thead = document.getElementById('sqlResultsHead');
            const tbody = document.getElementById('sqlResultsBody');
            const info = document.getElementById('sqlResultsInfo');

            const t0 = performance.now();
            const result = executeSqlQuery(sql);
            const elapsed = (performance.now() - t0).toFixed(1);

            if (result.error) {
                status.textContent = result.error;
                status.className = 'error';
                thead.innerHTML = '';
                tbody.innerHTML = '';
                info.textContent = '';
                return;
            }

            status.textContent = `${result.message} (${elapsed}ms)`;
            status.className = 'success';

            let headHtml = '<tr><th>#</th>';
            result.columns.forEach(col => { headHtml += `<th>${col}</th>`; });
            headHtml += '</tr>';
            thead.innerHTML = headHtml;

            let bodyHtml = '';
            result.values.forEach((row, i) => {
                bodyHtml += `<tr data-row-idx="${i}">`;
                bodyHtml += `<td style="color:#858585">${i + 1}</td>`;
                row.forEach(val => {
                    const display = val !== null ? String(val) : '';
                    const cls = val === null ? ' style="color:#555"' : '';
                    bodyHtml += `<td title="${display}"${cls}>${val !== null ? display : 'NULL'}</td>`;
                });
                bodyHtml += '</tr>';
            });
            tbody.innerHTML = bodyHtml;
            info.textContent = `${result.values.length}행 | ${result.columns.length}개 컬럼`;

            // 행 클릭: 좌표 컬럼 감지하여 카메라 이동
            const lonKw = ['경도', 'lon', 'longitude', 'lng', '_longitude'];
            const latKw = ['위도', 'lat', 'latitude', '_latitude'];
            let lonCol = -1, latCol = -1;
            result.columns.forEach((col, i) => {
                const lc = col.toLowerCase();
                if (lonCol < 0 && lonKw.some(k => lc.includes(k))) lonCol = i;
                if (latCol < 0 && latKw.some(k => lc.includes(k))) latCol = i;
            });

            tbody.querySelectorAll('tr').forEach(tr => {
                tr.addEventListener('click', () => {
                    tbody.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
                    tr.classList.add('selected');
                    if (lonCol >= 0 && latCol >= 0) {
                        const idx = parseInt(tr.dataset.rowIdx);
                        const lon = parseFloat(result.values[idx][lonCol]);
                        const lat = parseFloat(result.values[idx][latCol]);
                        if (!isNaN(lon) && !isNaN(lat) && typeof Module !== 'undefined') {
                            const camera = Module.getViewCamera();
                            if (camera) camera.move(new Module.JSVector3D(lon, lat, 500), 89.9, 0, 0);
                        }
                    }
                });
            });
        }

        // 하단 패널 이벤트 초기화
        function initBottomPanel() {
            // 리사이저
            const resizer = document.getElementById('bottom-panel-resizer');
            let isResizing = false;
            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                resizer.classList.add('dragging');
                document.body.style.cursor = 'ns-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });
            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const newH = window.innerHeight - e.clientY;
                bottomPanelHeight = Math.max(100, Math.min(newH, window.innerHeight * 0.7));
                updateMapSize();
            });
            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    resizer.classList.remove('dragging');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });

            // 창 벗어날 때 마우스 버튼 강제 릴리즈 (좌클릭 + 우클릭 모두)
            function releaseMouseOnCanvas() {
                const canvas = document.querySelector('canvas');
                if (canvas) {
                    canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, cancelable: true, button: 0, buttons: 0 }));
                    canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, cancelable: true, button: 2, buttons: 0 }));
                }
            }
            window.addEventListener('blur', releaseMouseOnCanvas);
            document.addEventListener('mouseleave', releaseMouseOnCanvas);

            // 닫기
            document.getElementById('bottomPanelClose').addEventListener('click', () => {
                const sliceToggle = document.getElementById('terrainSliceToggle');
                if (sliceToggle && sliceToggle.checked) {
                    sliceToggle.checked = false;
                    sliceToggle.dispatchEvent(new Event('change'));
                }
                hideBottomPanel();
            });

            // DB 탭 버튼 토글
            document.getElementById('dbTabButton').addEventListener('click', () => {
                if (bottomPanelVisible) {
                    sqlPanelOpen = false;
                    hideBottomPanel();
                } else {
                    sqlPanelOpen = true;
                    showBottomPanel();
                }
            });

            // 실행 버튼
            document.getElementById('sqlRunBtn').addEventListener('click', () => {
                const sql = document.getElementById('sqlInput').value.trim();
                if (sql) executeAndDisplayQuery(sql);
            });

            // Ctrl+Enter 실행
            document.getElementById('sqlInput').addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    const sql = e.target.value.trim();
                    if (sql) executeAndDisplayQuery(sql);
                }
            });

            // 테이블 선택
            document.getElementById('sqlTableSelect').addEventListener('change', (e) => {
                if (e.target.value) runDefaultQuery(e.target.value);
            });
        }

        // POI 아이콘 SVG 템플릿 (COLOR_PLACEHOLDER를 실제 색상으로 교체)
        const POI_ICON_TEMPLATES = {
            'pin': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36"><path fill="COLOR_PLACEHOLDER" d="M12,2C7.6,2,4,5.6,4,10c0,6.4,8,16,8,16s8-9.6,8-16C20,5.6,16.4,2,12,2z"/><circle fill="#FFF" cx="12" cy="10" r="4"/></svg>',
            'star': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="COLOR_PLACEHOLDER" d="M12,2.5l3.1,6.3l6.9,1l-5,4.9l1.2,6.9L12,18l-6.2,3.3l1.2-6.9l-5-4.9l6.9-1L12,2.5z"/></svg>',
            'home': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="COLOR_PLACEHOLDER" d="M10,20v-6h4v6h5V12h3L12,3l-10,9h3V20h5z"/></svg>',
            'flag': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="COLOR_PLACEHOLDER" d="M14,6l-1,2H7V4H6V21H7V13h5l-1,2h6V6h-3z"/></svg>',
            'circle': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><circle fill="COLOR_PLACEHOLDER" cx="12" cy="12" r="8"/></svg>'
        };

        // SVG 템플릿에 색상을 적용하여 data URL 생성
        function createColoredIconUrl(templateName, hexColor) {
            if (!POI_ICON_TEMPLATES[templateName]) {
                // 템플릿이 없으면 circle을 기본값으로
                templateName = 'circle';
            }
            const svg = POI_ICON_TEMPLATES[templateName].replace('COLOR_PLACEHOLDER', hexColor);
            const base64 = btoa(svg);
            return 'data:image/svg+xml;base64,' + base64;
        }

        // 컨텍스트 메뉴 숨기기 함수 (전역)
        function hideContextMenu() {
            const contextMenu = document.getElementById('contextMenu');
            if (contextMenu) {
                contextMenu.style.display = 'none';
            }
            // 레이어 강조 제거
            document.querySelectorAll('.layer-item.context-menu-active, .layer-item-container.context-menu-active').forEach(item => {
                item.classList.remove('context-menu-active');
            });
            window.currentContextLayer = null;
        }

        // 컨텍스트 메뉴 표시 함수 (위치 자동 조정)
        function showContextMenu(event, targetElement) {
            const contextMenu = document.getElementById('contextMenu');

            // 기존 강조 제거
            document.querySelectorAll('.layer-item.context-menu-active, .layer-item-container.context-menu-active').forEach(item => {
                item.classList.remove('context-menu-active');
            });

            // 현재 요소 강조
            if (targetElement) {
                targetElement.classList.add('context-menu-active');
            }

            // 메뉴를 일단 표시 (크기 계산을 위해)
            contextMenu.style.display = 'block';
            contextMenu.style.transform = 'none';

            // 마우스 위치
            let x = event.clientX;
            let y = event.clientY;

            // 메뉴 크기
            const menuRect = contextMenu.getBoundingClientRect();
            const menuWidth = menuRect.width;
            const menuHeight = menuRect.height;

            // 화면 크기
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            // 오른쪽으로 벗어나는 경우 왼쪽으로 이동
            if (x + menuWidth > viewportWidth) {
                x = viewportWidth - menuWidth - 10;
            }

            // 아래로 벗어나는 경우 위로 이동
            if (y + menuHeight > viewportHeight) {
                y = viewportHeight - menuHeight - 10;
            }

            // 위로 벗어나는 경우
            if (y < 0) {
                y = 10;
            }

            // 왼쪽으로 벗어나는 경우
            if (x < 0) {
                x = 10;
            }

            contextMenu.style.left = x + 'px';
            contextMenu.style.top = y + 'px';
        }

        function getLayerSemanticType(layer) {
            const t = layer.getType();

            switch (t) {
                case 5: // ELT_3DPOINT
                case 3: // ELT_BILLBOARD
                case 6: // ELT_3DS_SYMBOL
                    return "point";

                case 4: // ELT_3DLINE
                case 2: // ELT_PIPE
                    return "line";

                case 0: // ELT_POLYHEDRON
                case 1: // ELT_PLANE
                    return "polygon";

                case 8:  // ELT_TERRAIN
                case 11: // ELT_TERRAIN_IMAGE
                    return "raster";

                case 9:  // REAL3D / MULTIPLE (SDK별 다름)
                case 20: // TILE_LOD_MODEL
                    return "3dmodel";

                case 19: // POINT_CLOUD
                    return "pointcloud";

                default:
                    return "unknown";
            }
        }

        function buildContextMenu(layerData) {
            const menu = document.getElementById('contextMenu');
            menu.innerHTML = '';
            //menu.onclick = e => e.stopPropagation();

            // 공통 메뉴 아이템 추가 헬퍼
            const addMenuItem = (text, handler, danger = false) => {
                const item = document.createElement('div');
                item.className = 'context-menu-item' + (danger ? ' danger' : '');
                item.textContent = text;
                item.onclick = handler;
                menu.appendChild(item);
            };

            // =========================
            // 1) 레이어로 이동
            // =========================
            addMenuItem('레이어로 이동', () => {
                layerData.label?.click();
                hideContextMenu();
            });

            // =========================
            // 2) 레이어 이름 변경 (Label ↔ Input 토글)
            // =========================
            const nameBox = document.createElement('div');
            nameBox.className = 'context-menu-item';
            nameBox.style.display = 'flex';
            nameBox.style.alignItems = 'center';
            nameBox.style.gap = '5px';

            // label (기본 표시)
            const nameLabel = document.createElement('span');
            nameLabel.textContent = layerData.label?.textContent || 'Layer';
            nameLabel.style.width = '200px';
            nameLabel.style.display = 'inline-block';

            // input (숨김)
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.style.width = '200px';
            nameInput.style.padding = '4px 8px';
            nameInput.style.border = '1px solid #007acc';
            nameInput.style.borderRadius = '3px';
            nameInput.style.background = '#3c3c3c';
            nameInput.style.color = '#fff';
            nameInput.style.outline = 'none';
            nameInput.style.display = 'none';

            // 클릭 시 강제 포커스
            nameInput.addEventListener('mousedown', async (e) => {
                e.stopPropagation();
                if (window.electronAPI?.focusWindow) {
                    await window.electronAPI.focusWindow();
                }
            });
            nameInput.addEventListener('click', (e) => {
                e.stopPropagation();
                nameInput.focus();
            });

            // 버튼
            const nameBtn = document.createElement('button');
            nameBtn.textContent = '변경';
            nameBtn.style.width = '50px';

            let editing = false;

            nameBtn.onclick = async () => {
                editing = !editing;

                if (editing) {
                    // 변경 모드 진입
                    nameInput.value = nameLabel.textContent;
                    nameLabel.style.display = 'none';
                    nameInput.style.display = 'inline-block';
                    nameBtn.textContent = '적용';

                    // 포커스 (반복 시도)
                    if (window.electronAPI?.focusWindow) {
                        await window.electronAPI.focusWindow();
                    }
                    const focusInterval = setInterval(() => {
                        if (window.electronAPI?.focusWindow) {
                            window.electronAPI.focusWindow();
                        }
                        nameInput.focus();
                        if (document.activeElement === nameInput) {
                            nameInput.select();
                            clearInterval(focusInterval);
                        }
                    }, 100);
                    setTimeout(() => clearInterval(focusInterval), 2000);
                } else {
                    // 적용
                    const newName = nameInput.value.trim() || 'Layer';
                    nameLabel.textContent = newName;
                    layerData.name = newName;
                    if (layerData.label) layerData.label.textContent = newName;

                    nameLabel.style.display = 'inline-block';
                    nameInput.style.display = 'none';
                    nameBtn.textContent = '변경';
                }
            };

            nameInput.onkeydown = (e) => {
                if (e.key === 'Enter') nameBtn.click();
                if (e.key === 'Escape') {
                    editing = false;
                    nameLabel.style.display = 'inline-block';
                    nameInput.style.display = 'none';
                    nameBtn.textContent = '변경';
                }
            };

            nameBox.appendChild(nameLabel);
            nameBox.appendChild(nameInput);
            nameBox.appendChild(nameBtn);
            menu.appendChild(nameBox);


            // =========================
            // 3) semantic type 판별
            // =========================
            const semanticType = getLayerSemanticType(layerData.layer);

            // =========================
            // 4) 타입별 스타일 UI
            // =========================
            const styleBox = document.createElement('div');
            styleBox.className = 'context-menu-item';

            const colorPicker = (label, key) => {
                const wrap = document.createElement('div');
                wrap.style.display = 'flex';
                wrap.style.justifyContent = 'space-between';
                wrap.style.alignItems = 'center';

                const span = document.createElement('span');
                span.textContent = label;

                const controlWrap = document.createElement('div');
                controlWrap.style.display = 'flex';
                controlWrap.style.alignItems = 'center';
                controlWrap.style.gap = '8px';

                const input = document.createElement('input');
                input.type = 'color';
                input.value = layerData.style?.[key] || '#ffffff';

                const hexCode = document.createElement('span');
                hexCode.className = 'color-code';
                hexCode.textContent = input.value.toUpperCase();

                input.oninput = () => {
                    layerData.style = layerData.style || {};
                    layerData.style[key] = input.value;
                    hexCode.textContent = input.value.toUpperCase();
                    layerData.updateStyle?.();
                };

                controlWrap.append(input, hexCode);
                wrap.append(span, controlWrap);
                return wrap;
            };

            const rangeSlider = (label, min, max, key) => {
                const wrap = document.createElement('div');
                wrap.style.display = 'flex';
                wrap.style.justifyContent = 'space-between';
                wrap.style.alignItems = 'center';

                const span = document.createElement('span');
                span.textContent = label;

                const controlWrap = document.createElement('div');
                controlWrap.style.display = 'flex';
                controlWrap.style.alignItems = 'center';
                controlWrap.style.gap = '8px';

                const input = document.createElement('input');
                input.type = 'range';
                input.min = min;
                input.max = max;
                input.value = layerData.style?.[key] || min;
                input.style.width = '100px';

                const valueSpan = document.createElement('span');
                valueSpan.textContent = input.value;
                valueSpan.style.fontSize = '11px';
                valueSpan.style.color = '#cccccc';
                valueSpan.style.minWidth = '25px';
                valueSpan.style.textAlign = 'right';

                input.oninput = () => {
                    layerData.style = layerData.style || {};
                    layerData.style[key] = input.value;
                    valueSpan.textContent = input.value;
                    layerData.updateStyle?.();
                };

                controlWrap.append(input, valueSpan);
                wrap.append(span, controlWrap);
                return wrap;
            };

            const iconSelector = (label, key) => {
                const wrap = document.createElement('div');
                wrap.style.display = 'flex';
                wrap.style.justifyContent = 'space-between';
                wrap.style.alignItems = 'center';

                const span = document.createElement('span');
                span.textContent = label;

                const select = document.createElement('select');
                select.style.backgroundColor = '#3c3c3c';
                select.style.color = '#cccccc';
                select.style.border = '1px solid #555';
                select.style.borderRadius = '3px';
                select.style.padding = '4px 8px';
                select.style.fontSize = '11px';
                select.style.cursor = 'pointer';
                select.style.outline = 'none';
                select.style.minWidth = '120px';

                const options = [
                    { value: 'circle', text: '● 원형' },
                    { value: 'pin', text: '📍 핀' },
                    { value: 'star', text: '⭐ 별' },
                    { value: 'home', text: '🏠 집' },
                    { value: 'flag', text: '🚩 깃발' }
                ];

                options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt.value;
                    option.textContent = opt.text;
                    select.appendChild(option);
                });

                select.value = layerData.style?.[key] || 'circle';

                select.onchange = () => {
                    layerData.style = layerData.style || {};
                    layerData.style[key] = select.value;
                    console.log('아이콘 타입 변경:', select.value);
                    layerData.updateStyle?.();
                };

                wrap.append(span, select);
                return wrap;
            };

            // 타입별 UI 분기
            if (semanticType === "point") {
                styleBox.appendChild(colorPicker('점 색상', 'pointColor'));
                styleBox.appendChild(rangeSlider('점 크기', 1, 50, 'pointSize'));
                styleBox.appendChild(iconSelector('아이콘 종류', 'iconType'));
            }

            if (semanticType === "line") {
                styleBox.appendChild(colorPicker('선 색상', 'lineColor'));
                styleBox.appendChild(rangeSlider('선 두께', 1, 20, 'lineWidth'));
            }

            if (semanticType === "polygon") {
                styleBox.appendChild(colorPicker('면색상', 'fillColor'));
                styleBox.appendChild(rangeSlider('면투명도', 0, 100, 'fillOpacity'));

                const divider = document.createElement('div');
                divider.style.height = '1px';
                divider.style.backgroundColor = '#454545';
                divider.style.margin = '8px 0';
                styleBox.appendChild(divider);

                styleBox.appendChild(colorPicker('선색상', 'lineColor'));
                styleBox.appendChild(rangeSlider('선투명도', 0, 100, 'strokeOpacity'));
            }

            if (styleBox.children.length > 0) {
                menu.appendChild(styleBox);
            }

            // =========================
            // 5) 테이블 열기
            // =========================
            const layerFileName = layerData.fileName || layerData.label?.textContent;
            if (layerFileName) {
                const tableName = findSqliteTable(layerFileName);
                if (tableName) {
                    addMenuItem('테이블 열기', () => {
                        sqlPanelOpen = true;
                        showBottomPanel();
                        document.getElementById('sqlTableSelect').value = tableName;
                        runDefaultQuery(tableName);
                        hideContextMenu();
                    });
                }
            }

            // =========================
            // 6) 레이어 제거
            // =========================
            addMenuItem('레이어 제거', () => {
                layerData.removeBtn?.click();
                hideContextMenu();
            }, true);
  
        }


        // 사이드바 탭 토글 기능
        document.addEventListener('DOMContentLoaded', async () => {
            // 앱 버전 표시
            if (window.electronAPI?.getAppVersion) {
                const version = await window.electronAPI.getAppVersion();
                document.getElementById('app-version').textContent = `v${version}`;
                document.title = `XDViewer v${version}`;
            }

            // GitHub 링크 클릭 이벤트
            const githubLink = document.getElementById('github-link');
            if (githubLink) {
                githubLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.electronAPI.openExternal('https://github.com/XDBuilder/XDViewer');
                });
            }

            // 베이스맵 변경
            let currentBasemap = null;
            const basemapSelect = document.getElementById('basemapSelect');
            const basemapQuality = document.getElementById('basemapQuality');

            function applyBasemap(type) {
                const t = parseInt(type);
                // 기존 베이스맵 제거
                if (currentBasemap) {
                    currentBasemap.clear();
                    currentBasemap = null;
                }
                if (t === 0) return;
                if (t === 11) { basemapSelect.value = '0'; return; }

                switch (t) {
                    case 1:  currentBasemap = Module.GoogleMap(); currentBasemap.layername = 'normal'; break;
                    case 2:  currentBasemap = Module.GoogleMap(); currentBasemap.layername = 'terrain'; break;
                    case 3:  currentBasemap = Module.GoogleMap(); currentBasemap.layername = 'vectorhybrid'; break;
                    case 4:  currentBasemap = Module.GoogleMap(); currentBasemap.layername = 'satellitehybrid'; break;
                    case 5:  currentBasemap = Module.GoogleMap(); currentBasemap.layername = 'satellite'; break;
                    case 6:  currentBasemap = Module.ArcMap(); currentBasemap.layername = 'normal'; break;
                    case 7:  currentBasemap = Module.ArcMap(); currentBasemap.layername = 'terrain'; break;
                    case 8:  currentBasemap = Module.ArcMap(); currentBasemap.layername = 'vectorhybrid'; break;
                    case 9:  currentBasemap = Module.ArcMap(); currentBasemap.layername = 'satellite'; break;
                    case 10: currentBasemap = Module.OpenStreetMap(); currentBasemap.layername = 'normal'; break;
                }
                if (currentBasemap) {
                    const quality = basemapQuality.value;
                    currentBasemap.quality = quality;
                    currentBasemap.zerolevelOffset = (quality === 'low') ? 0 : 1;
                    currentBasemap.refresh();
                }
            }

            basemapSelect.addEventListener('change', (e) => applyBasemap(e.target.value));
            basemapQuality.addEventListener('change', () => {
                if (currentBasemap) {
                    const quality = basemapQuality.value;
                    currentBasemap.quality = quality;
                    currentBasemap.zerolevelOffset = (quality === 'low') ? 0 : 1;
                    currentBasemap.refresh();
                }
            });

            // 지도 컨트롤 버튼
            // 새로고침 버튼: 카메라는 그대로, 지형·영상 타일만 다시 요청(엔진 XDEPlanetRefresh). 우리 타일 서버 캐시도 비워
            // 현재 설정(배율·업샘플·색상)으로 다시 만들어지게 한다. 페이지 전체 리로드는 개발용으로 F5에만 둔다.
            async function refreshPlanet() {
                try { await window.electronAPI.clearTileCaches(); } catch (e) { /* 무시 */ }
                Module.XDEPlanetRefresh();
                Module.XDRenderData();
            }
            document.getElementById('btnReload').addEventListener('click', refreshPlanet);
            window.addEventListener('keydown', (e) => {
                if (e.key === 'F5' && !e.ctrlKey && !e.altKey) { e.preventDefault(); location.reload(); }
            });
            window.XDV = Object.assign(window.XDV || {}, { refresh: refreshPlanet });

            document.getElementById('btnResetView').addEventListener('click', () => {
                Module.getViewCamera().move(new Module.JSVector3D(126.9, 37.5, 19000000), 89.9, 0, 0);
            });

            const btnNorthView = document.getElementById('btnNorthView');
            const northIcon = btnNorthView.querySelector('svg');
            const horizonLine = northIcon.querySelector('#horizonLine');
            btnNorthView.addEventListener('click', () => {
                const camera = Module.getViewCamera();
                const pos = camera.getLocation();
                const tilt = camera.getTilt();
                camera.move(new Module.JSVector3D(pos.Longitude, pos.Latitude, pos.Altitude), tilt, 0, 0);
            });

            // 줌아웃 고도 상한. 무제한으로 멀어지면 지구본이 화면에서 사라진다(2.5억 m에서도 보이지만 이후 점).
            // 엔진의 camera.setLimitCamera(true)+setLimitAltitude(h)는 고도를 h에 고정해 버려(실측: 1000m 이동도 h로) 쓰지 않는다.
            // 대신 상한 근처에서 휠 줌아웃을 엔진에 닿기 전에 차단하고, 다른 경로로 넘친 고도는 프레임마다 되돌린다.
            const CAMERA_MAX_ALTITUDE = 50000000; // m
            // 해수면 아래(수심 DEM 위) 카메라: 엔진 휠 줌인은 지표 픽킹 지점을 향해 다가가는데 음수 고도에선 픽킹이 실패해
            // 카메라가 지구 반대편(-4,700km)으로 튄다(실측). 그래서 고도가 0 아래면 휠을 가로채 우리가 지형까지 거리 비례로 다가간다.
            const CAMERA_MIN_ALTITUDE = -12000;   // 지구 최심(-11,000m)보다 아래면 비정상
            const CAMERA_GROUND_MARGIN = 30;      // 지형 위 최소 여유(m)
            const terrainHeightAt = (lon, lat) => {
                try {
                    const m = Module.getMap();
                    const h = m.getTerrHeightFast ? m.getTerrHeightFast(lon, lat) : m.getTerrHeight(lon, lat);
                    return Number.isFinite(h) ? h : 0;
                } catch (e) { return 0; }
            };
            window.addEventListener('wheel', (e) => {
                try {
                    const camera = Module.getViewCamera();
                    const pos = camera.getLocation();
                    if (e.deltaY > 0 && pos.Altitude >= CAMERA_MAX_ALTITUDE * 0.95) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        return;
                    }
                    if (pos.Altitude < 0) {
                        // 수중: 지형까지 남은 거리의 25%씩 다가가거나 멀어진다 (지형 위 여유는 유지)
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        const ground = terrainHeightAt(pos.Longitude, pos.Latitude);
                        const gap = Math.max(pos.Altitude - ground, CAMERA_GROUND_MARGIN);
                        const nextAlt = e.deltaY < 0
                            ? Math.max(ground + CAMERA_GROUND_MARGIN, pos.Altitude - gap * 0.25)
                            : pos.Altitude + gap * 0.33;
                        camera.move(new Module.JSVector3D(pos.Longitude, pos.Latitude, nextAlt), camera.getTilt(), camera.getDirect(), 0);
                    }
                } catch (e2) {}
            }, { capture: true, passive: false });
            let lastGoodCam = null;   // 정상 범위였던 마지막 카메라 {lon, lat, alt, tilt, dir}

            // 카메라 방향에 따라 나침반 아이콘 회전 (+ 고도 상한 되돌림)
            (function updateCompass() {
                try {
                    const camera = Module.getViewCamera();
                    const dir = camera.getDirect();
                    const tilt = camera.getTilt();
                    const pos = camera.getLocation();
                    if (pos.Altitude > CAMERA_MAX_ALTITUDE) {
                        camera.move(new Module.JSVector3D(pos.Longitude, pos.Latitude, CAMERA_MAX_ALTITUDE), tilt, dir, 0);
                    } else if (pos.Altitude < CAMERA_MIN_ALTITUDE || (pos.Altitude < 0 && pos.Altitude < terrainHeightAt(pos.Longitude, pos.Latitude) - CAMERA_GROUND_MARGIN * 4)) {
                        // 지구를 뚫었거나 해저 지형 아래로 들어간 경우: 마지막 정상 위치로
                        if (lastGoodCam) camera.move(new Module.JSVector3D(lastGoodCam.lon, lastGoodCam.lat, lastGoodCam.alt), lastGoodCam.tilt, lastGoodCam.dir, 0);
                    } else {
                        lastGoodCam = { lon: pos.Longitude, lat: pos.Latitude, alt: pos.Altitude, tilt, dir };
                    }
                    northIcon.style.transform = 'rotate(' + (-dir) + 'deg)';
                    // tilt 90°(수직) → y=2(상단), tilt 0°(수평) → y=10(중앙)
                    const y = Math.max(2, Math.min(18, 10 - (tilt / 90) * 8));
                    horizonLine.setAttribute('y1', y);
                    horizonLine.setAttribute('y2', y);
                } catch (e) {}
                requestAnimationFrame(updateCompass);
            })();

            // 건물 표시 설정
            let buildingLayer = null;
            const buildingToggle = document.getElementById('buildingToggle');
            const buildingOptions = document.getElementById('buildingOptions');
            const simpleModeToggle = document.getElementById('simpleModeToggle');
            const simpleModeText = document.getElementById('simpleModeText');

            function addBuildingLayer() {
                if (buildingLayer) return;
                buildingLayer = Module.getTileLayerList().createXDServerLayer({
                    url: "https://xdworld.vworld.kr",
                    servername: "XDServer3d",
                    name: "facility_build",
                    type: 9,
                    minLevel: 0,
                    maxLevel: 15
                });
                Module.setVisibleRange("facility_build", 3.0, 100000.0);

                // 현재 설정값 적용
                if (simpleModeToggle.checked) {
                    Module.getMap().setSimpleMode(true);
                    const renderMode = document.querySelector('input[name="renderMode"]:checked').value;
                    Module.getMap().setRenderMode(parseInt(renderMode));
                    const edgeRender = document.querySelector('input[name="edgeRender"]:checked').value === 'true';
                    Module.SetSimpleModeLineRender(edgeRender);
                }
            }

            function removeBuildingLayer() {
                if (!buildingLayer) return;
                Module.getMap().setSimpleMode(false);
                Module.getTileLayerList().delLayerAtName("facility_build");
                buildingLayer = null;
            }

            buildingToggle.addEventListener('change', () => {
                if (buildingToggle.checked) {
                    buildingOptions.classList.add('visible');
                    addBuildingLayer();
                } else {
                    buildingOptions.classList.remove('visible');
                    removeBuildingLayer();
                }
            });

            simpleModeToggle.addEventListener('change', () => {
                const on = simpleModeToggle.checked;
                simpleModeText.textContent = on ? 'ON' : 'OFF';
                if (buildingLayer) {
                    Module.getMap().setSimpleMode(on);
                    if (on) {
                        const renderMode = document.querySelector('input[name="renderMode"]:checked').value;
                        Module.getMap().setRenderMode(parseInt(renderMode));
                        const edgeRender = document.querySelector('input[name="edgeRender"]:checked').value === 'true';
                        Module.SetSimpleModeLineRender(edgeRender);
                    }
                }
            });

            document.querySelectorAll('input[name="renderMode"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (buildingLayer && simpleModeToggle.checked) {
                        Module.getMap().setRenderMode(parseInt(e.target.value));
                    }
                });
            });

            document.querySelectorAll('input[name="edgeRender"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (buildingLayer && simpleModeToggle.checked) {
                        Module.SetSimpleModeLineRender(e.target.value === 'true');
                    }
                });
            });

            // 지형 렌더링 모드
            const terrainLegend = document.getElementById('terrainLegend');
            const legendTitle = document.getElementById('legendTitle');
            const legendItems = document.getElementById('legendItems');

            function makeLegendItems(entries) {
                legendItems.innerHTML = entries.map(([color, label]) =>
                    `<div style="display:flex;align-items:center;gap:6px;">
                        <div style="width:14px;height:14px;border-radius:2px;background:${color};flex-shrink:0;"></div>
                        <span style="font-size:11px;color:#ccc;">${label}</span>
                    </div>`
                ).join('');
            }

            function showTerrainLegend(val) {
                if (val === 10) {
                    legendTitle.textContent = '경사도 (Slope)';
                    makeLegendItems([
                        ['#ffffff', '0°'],
                        ['#00c800', '15°'],
                        ['#ffff00', '30°'],
                        ['#ff8000', '45°'],
                        ['#ff0000', '90°+'],
                    ]);
                    terrainLegend.style.display = 'flex';
                } else if (val === 11) {
                    legendTitle.textContent = '향 (Aspect)';
                    makeLegendItems([
                        ['#ff0000', 'S (남)'],
                        ['#ff8000', 'SE (남동)'],
                        ['#ffff00', 'E (동)'],
                        ['#80ff00', 'NE (북동)'],
                        ['#00ff00', 'N (북)'],
                        ['#00ffff', 'NW (북서)'],
                        ['#0000ff', 'W (서)'],
                        ['#ff00ff', 'SW (남서)'],
                    ]);
                    terrainLegend.style.display = 'flex';
                } else if (val === 1) {
                    // 고도 색상: 세로 그라디언트 바 + 최대/0/최소 눈금
                    const { min, max, rgb } = terrainColorState;
                    legendTitle.textContent = '고도 (m)';
                    // 지형과 같은 띠로: i번째 색이 i/N ~ (i+1)/N 구간을 차지하는 hard stop 그라디언트. 부드러운 색(영상)이면 연속.
                    const N = rgb.length;
                    const smooth = document.getElementById('terrainColorSmooth').checked && !!activeDemSource;
                    const grad = smooth
                        ? rgb.map((c, i) => `rgb(${c.join(',')}) ${(i / (N - 1) * 100).toFixed(2)}%`).join(', ')
                        : rgb.map((c, i) => `rgb(${c.join(',')}) ${(i / N * 100).toFixed(2)}% ${((i + 1) / N * 100).toFixed(2)}%`).join(', ');
                    const ticks = [[max, 0]];
                    if (min < 0 && max > 0) ticks.push([0, (max / (max - min)) * 100]);
                    ticks.push([min, 100]);
                    legendItems.innerHTML = `<div style="display:flex;gap:8px;align-items:stretch;">
                        <div style="width:14px;height:140px;border-radius:2px;background:linear-gradient(to top, ${grad});"></div>
                        <div style="position:relative;width:64px;height:140px;font-size:11px;color:#ccc;">
                            ${ticks.map(([v, pct]) => `<span style="position:absolute;left:0;top:${pct}%;transform:translateY(-50%);white-space:nowrap;">${v.toLocaleString()}</span>`).join('')}
                        </div></div>`;
                    terrainLegend.style.display = 'flex';
                } else {
                    terrainLegend.style.display = 'none';
                }
            }

            // ---- 고도 색상 (Module.getMap().setTerrainEffect(1) + Module.getTerrain().setTerrainColor) ----
            // 엔진은 colorlist를 altitudemin~altitudemax에 균등 배치하되 앞 32색만 쓴다(실측). 음수 min(수심)도 정상 동작.
            // 컬러맵은 과학계 표준을 쓴다.
            //   abs  : 고도(m) 절대값에 색이 붙은 지형·수심 맵(ETOPO1, GMT relief/globe). 범위를 바꿔도 같은 고도는 같은 색.
            //   split: 해면 0m에서 바다/육지 램프가 나뉘고 각 쪽을 범위에 맞춰 정규화(cmocean topo).
            //   norm : 범위 전체에 균등(matplotlib terrain, viridis, turbo, grayscale).
            const TERRAIN_CMAPS = {
                // NASA Blue Marble/ETOPO 자연색 지형도 배색. 대륙붕(0~-200m)은 거의 흰 청록, 심해는 짙은 청회색,
                // 육지는 저지대 짙은 녹색을 1,000m까지 넓게 유지하고 고지대에서 갈색→회백→흰색. 32색 제한이라 범위를 좁힐수록 부드럽다.
                natural: { kind: 'abs', label: '자연색 지형',
                    ocean: [[-9000,[34,52,72]],[-7000,[40,66,92]],[-5500,[48,84,118]],[-4500,[60,104,146]],[-3500,[76,128,176]],[-2500,[98,156,204]],[-1500,[128,186,226]],[-800,[160,210,238]],[-300,[196,232,246]],[-120,[220,244,248]],[-30,[236,250,250]],[0,[242,252,250]]],
                    land:  [[0,[38,100,44]],[150,[42,110,48]],[400,[58,122,52]],[800,[92,134,58]],[1200,[128,140,64]],[1600,[152,132,72]],[2000,[168,122,82]],[2500,[178,142,112]],[3000,[192,170,150]],[3600,[208,198,188]],[4200,[226,222,218]],[5000,[244,244,244]],[6500,[255,255,255]]] },
                etopo1: { kind: 'abs', label: 'ETOPO1',
                    ocean: [[-11000,[10,0,121]],[-10000,[38,0,152]],[-9000,[16,6,180]],[-8000,[0,14,203]],[-7000,[0,30,216]],[-6000,[12,68,231]],[-5000,[19,117,244]],[-4000,[21,158,252]],[-3000,[43,186,255]],[-2000,[65,200,255]],[-1000,[94,223,255]],[-500,[138,227,255]],[0,[188,230,255]]],
                    land:  [[0,[51,102,0]],[100,[51,204,102]],[200,[187,228,146]],[500,[255,220,185]],[1000,[243,202,137]],[1500,[230,184,88]],[2000,[217,166,39]],[2500,[168,154,31]],[3000,[164,144,25]],[4000,[159,123,13]],[5000,[153,102,0]],[5500,[162,89,89]],[6000,[178,118,118]],[7000,[194,176,176]],[8000,[229,229,229]]] },
                relief: { kind: 'abs', label: 'GMT relief',
                    ocean: [[-8000,[0,0,0]],[-7000,[0,5,25]],[-6000,[0,10,50]],[-5000,[0,80,125]],[-4000,[0,150,200]],[-3000,[86,197,184]],[-2000,[172,245,168]],[-1000,[211,250,211]],[0,[250,255,255]]],
                    land:  [[0,[70,120,50]],[500,[120,100,50]],[1000,[146,126,60]],[2000,[198,178,80]],[3000,[250,230,100]],[4000,[250,234,126]],[5000,[252,238,152]],[6000,[252,243,177]],[7000,[253,249,216]],[8000,[255,255,255]]] },
                globe: { kind: 'abs', label: 'GMT globe',
                    ocean: [[-10000,[153,0,255]],[-9000,[153,0,255]],[-8000,[153,0,255]],[-7000,[136,17,255]],[-6000,[119,34,255]],[-5000,[102,51,255]],[-4000,[85,68,255]],[-3000,[68,85,255]],[-2000,[51,102,255]],[-1000,[34,119,255]],[-500,[17,136,255]],[-200,[0,153,255]],[0,[27,164,255]]],
                    land:  [[0,[51,102,0]],[100,[51,204,102]],[200,[187,228,146]],[500,[255,220,185]],[1000,[243,202,137]],[1500,[230,184,88]],[2000,[217,166,39]],[2500,[168,154,31]],[3000,[164,144,25]],[3500,[162,134,19]],[4000,[159,123,13]],[4500,[156,113,7]],[5000,[153,102,0]],[5500,[162,89,89]],[6000,[178,118,118]],[6500,[183,147,147]],[7000,[194,176,176]],[7500,[204,204,204]],[8000,[229,229,229]],[8500,[242,242,242]],[9000,[255,255,255]]] },
                topo: { kind: 'split', label: 'cmocean topo',
                    ocean: [[0,[16,17,60]],[0.25,[30,56,120]],[0.5,[40,110,170]],[0.75,[100,175,205]],[1,[190,230,235]]],
                    land:  [[0,[40,115,60]],[0.25,[110,150,60]],[0.5,[180,140,70]],[0.75,[200,180,150]],[1,[245,245,245]]] },
                terrain: { kind: 'norm', label: 'matplotlib terrain',
                    stops: [[0,[51,51,153]],[0.15,[0,153,255]],[0.25,[0,204,102]],[0.5,[255,255,153]],[0.75,[128,102,102]],[1,[255,255,255]]] },
                viridis: { kind: 'norm', label: 'viridis',
                    stops: [[0,[68,1,84]],[0.125,[71,44,122]],[0.25,[59,81,139]],[0.375,[44,113,142]],[0.5,[33,144,141]],[0.625,[39,173,129]],[0.75,[92,200,99]],[0.875,[170,220,50]],[1,[253,231,37]]] },
                turbo: { kind: 'norm', label: 'turbo',
                    stops: [[0,[48,18,59]],[0.125,[65,110,227]],[0.25,[35,175,236]],[0.375,[42,213,168]],[0.5,[122,230,96]],[0.625,[205,220,40]],[0.75,[253,180,50]],[0.875,[236,101,26]],[1,[122,4,3]]] },
                gray: { kind: 'norm', label: 'grayscale', stops: [[0,[0,0,0]],[1,[255,255,255]]] }
            };
            // XDWorld 샘플(Terrain Altitude Color)의 32색 테마. 범위 균등(norm)으로 넣는다.
            const XD_SAMPLE_THEMES = {
                xd_standard: '8,0,255;0,22,255;0,53,255;0,83,255;0,114,255;0,144,255;0,175,255;0,205,255;0,236,255;0,255,244;0,255,214;0,255,183;0,255,153;0,255,122;0,255,92;0,255,61;0,255,31;0,255,0;30,255,0;60,255,0;91,255,0;121,255,0;152,255,0;182,255,0;213,255,0;243,255,0;255,237,0;255,206,0;255,176,0;255,145,0;255,115,0;255,84,0',
                xd_warm: '255,102,0;255,118,0;255,126,0;255,129,0;255,127,0;255,143,0;255,157,0;255,168,0;255,181,0;255,189,0;255,198,0;255,204,0;255,210,0;255,220,0;255,233,0;255,246,0;254,252,0;246,249,7;232,242,17;218,232,27;203,223,36;174,202,57;155,187,70;145,180,77;123,162,92;104,147,104;78,126,123;63,114,133;43,97,148;39,94,150;29,87,157;20,79,164',
                xd_sea: '7,64,61;6,74,66;6,85,72;4,101,79;2,123,89;0,143,98;0,156,104;0,174,112;0,180,115;0,193,123;0,205,128;0,216,135;0,225,140;0,234,145;0,239,148;0,247,156;0,251,159;0,254,163;3,254,170;7,254,177;20,255,194;22,255,198;31,253,208;38,247,217;43,243,222;49,239,228;52,236,232;56,232,236;67,223,247;67,223,248;68,222,248;73,218,255',
                xd_plant: '0,193,190;0,184,166;0,178,149;0,168,120;0,162,106;0,156,94;0,152,85;0,148,80;1,144,75;3,139,70;7,134,68;16,124,68;28,112,75;36,104,81;44,98,87;55,88,96;64,82,102;73,74,110;85,65,119;99,54,127;116,43,131;125,37,129;128,34,127;137,29,119;145,26,112;149,25,106;156,22,95;165,19,78;169,18,71;170,17,70;179,15,50;186,13,37',
                xd_sky: '73,218,255;68,222,248;67,223,248;67,223,247;56,232,236;52,236,232;49,239,228;43,243,222;38,247,217;31,253,208;22,255,198;20,255,194;7,254,177;3,254,170;0,254,163;0,251,159;0,247,156;0,239,148;0,234,145;0,225,140;0,216,135;0,205,128;0,193,123;0,180,115;0,174,112;0,156,104;0,143,98;2,123,89;4,101,79;6,85,72;6,74,66;7,64,61'
            };
            for (const [key, str] of Object.entries(XD_SAMPLE_THEMES)) {
                const cols = str.split(';').map(t => t.split(',').map(Number));
                TERRAIN_CMAPS[key] = { kind: 'norm', label: 'XDWorld ' + key.slice(3), stops: cols.map((c, i) => [i / (cols.length - 1), c]) };
            }
            // 색 구간 수. 엔진은 colorlist를 보간하지 않고 구간별 단색으로 칠하고(실측), **앞 32색만 써서 범위에 펼친다**
            // (33색 이상은 뒤가 버려져 앞쪽 색이 전체를 덮음 — 128색이면 육지까지 심해색). 따라서 최대 32. UI '단계'로 조절.
            const TERRAIN_COLOR_MAX_STEPS = 32;
            const terrainColorSteps = document.getElementById('terrainColorSteps');
            const getTerrainColorSteps = () => Math.min(TERRAIN_COLOR_MAX_STEPS, Math.max(2, parseInt(terrainColorSteps.value, 10) || 32));
            // stops: [[key, [r,g,b]], …] (key 오름차순). key 범위 밖은 양 끝 색으로 고정.
            const rampColor = (stops, k) => {
                if (k <= stops[0][0]) return stops[0][1];
                for (let i = 1; i < stops.length; i++) {
                    if (k <= stops[i][0]) {
                        const [k0, c0] = stops[i - 1], [k1, c1] = stops[i], u = (k - k0) / ((k1 - k0) || 1);
                        return c0.map((v, j) => Math.round(v + (c1[j] - v) * u));
                    }
                }
                return stops[stops.length - 1][1];
            };
            function terrainColorAt(cmap, alt, min, max) {
                if (cmap.kind === 'abs') return alt < 0 ? rampColor(cmap.ocean, alt) : rampColor(cmap.land, alt);
                if (cmap.kind === 'split') return alt < 0 ? rampColor(cmap.ocean, min < 0 ? 1 - alt / min : 1) : rampColor(cmap.land, max > 0 ? alt / max : 0);
                return rampColor(cmap.stops, (alt - min) / ((max - min) || 1));
            }
            function buildTerrainColorRgb(theme, min, max) {
                const cmap = TERRAIN_CMAPS[theme] || TERRAIN_CMAPS.etopo1;
                const N = getTerrainColorSteps(), out = [];
                for (let i = 0; i < N; i++) {
                    // 구간 중앙 고도의 색 (i번째 띠가 덮는 고도 범위의 가운데)
                    out.push(terrainColorAt(cmap, min + (max - min) * (i + 0.5) / N, min, max));
                }
                return out;
            }

            const terrainColorMin = document.getElementById('terrainColorMin');
            const terrainColorMax = document.getElementById('terrainColorMax');
            const terrainColorTheme = document.getElementById('terrainColorTheme');
            const terrainColorOpacity = document.getElementById('terrainColorOpacity');
            const terrainColorOpacityText = document.getElementById('terrainColorOpacityText');
            const terrainColorOptions = document.getElementById('terrainColorOptions');
            const terrainColorState = { min: -6000, max: 4000, rgb: [] };

            function applyTerrainColor() {
                let min = parseFloat(terrainColorMin.value), max = parseFloat(terrainColorMax.value);
                if (!Number.isFinite(min) || !Number.isFinite(max)) return;
                if (max < min) { [min, max] = [max, min]; terrainColorMin.value = min; terrainColorMax.value = max; }
                if (max === min) max = min + 1;
                // 해면(0m)이 띠 경계에 오도록 max를 살짝 조정한다. 엔진은 N색을 min~max에 균등 배치하므로 0이 띠 한가운데에
                // 걸리면 바다(0m)가 육지 첫 띠 색으로 칠해진다(실측: -8000~6000·32단계에서 바다가 녹색). abs/split 맵에만 적용.
                const cmapKind = (TERRAIN_CMAPS[terrainColorTheme.value] || TERRAIN_CMAPS.natural).kind;
                // 경계는 정확히 0이 아니라 +2m에 둔다: 기본 VWorld 지형의 바다는 0m 근처에서 ±수십 cm로 흔들려(실측: 녹색 바다에 흰 점 얼룩)
                // 0에 두면 반은 육지색이 된다. 2m 아래 육지는 무시할 만하다.
                const SEA_EDGE = 2;
                if (cmapKind !== 'norm' && min < 0 && max > SEA_EDGE) {   // 범위에 바다(음수)가 있을 때만
                    const N = getTerrainColorSteps();
                    const k = Math.max(1, Math.min(N - 1, Math.round((SEA_EDGE - min) / (max - min) * N))); // 해면 아래 띠 수
                    const snapped = Math.round(min + (SEA_EDGE - min) * N / k);
                    if (snapped !== max) { max = snapped; terrainColorMax.value = max; }
                }
                const alpha = Math.round(parseFloat(terrainColorOpacity.value) * 255);
                const rgb = buildTerrainColorRgb(terrainColorTheme.value, min, max);
                Object.assign(terrainColorState, { min, max, rgb });
                Module.getTerrain().setTerrainColor({
                    altitudemin: min, altitudemax: max,
                    colorlist: rgb.map(([r, g, b]) => new Module.JSColor(alpha, r, g, b)) // ARGB: 알파가 맨 앞
                });
                Module.XDRenderData();
                showTerrainLegend(1);
                updateDemColorLayer(min, max, alpha);
            }

            // ---- 부드러운 색: DEM에서 연속 그라데이션(+힐셰이드) 영상 타일을 만들어 지형 위에 덮는다 ----
            // 엔진 지형 색상(32색 구간 단색) 대신 쓰므로 켜면 setTerrainEffect(0)으로 띠 색을 끈다.
            const terrainColorSmooth = document.getElementById('terrainColorSmooth');
            const terrainColorShade = document.getElementById('terrainColorShade');
            let demColorBusy = false;
            async function updateDemColorLayer(min, max, alpha) {
                const want = terrainColorSmooth.checked && activeDemSource
                    && document.querySelector('input[name="terrainRenderMode"]:checked').value === '1';
                if (!want) {
                    removeDemColorLayer();
                    if (terrainColorSmooth.checked && !activeDemSource) terrainColorSmooth.title = '적용할 DEM이 없습니다. 지형 sdb나 DEM 폴더를 먼저 올리세요.';
                    return;
                }
                if (demColorBusy) return;
                demColorBusy = true;
                try {
                    const cmap = TERRAIN_CMAPS[terrainColorTheme.value] || TERRAIN_CMAPS.natural;
                    const colors = [];
                    for (let i = 0; i < 256; i++) colors.push(terrainColorAt(cmap, min + (max - min) * i / 255, min, max));
                    const ramp = { min, max, colors, alpha };
                    const hillshade = Number(terrainColorShade.value) || 0;
                    // 레이어를 새로 만들어야 엔진이 타일을 다시 받는다 (기존 것은 제거)
                    removeDemColorLayer();
                    const dem = activeDemSource;
                    const maxL = Math.min(20, (Number.isFinite(dem.maxL) ? dem.maxL : 14) + 3);
                    const minL = Math.max(1, Number.isFinite(dem.minL) ? dem.minL : 1);
                    const src = await window.electronAPI.registerImageSource({
                        kind: 'demcolor', demSourceId: dem.id, ramp, hillshade, bounds: dem.bounds, minL, maxL
                    });
                    if (src.error) { alert('DEM 색상 영상을 만들 수 없습니다.\n\n' + src.error); return; }
                    const name = `${dem.name} 색상`;
                    demColorLayer = { id: src.id, name };
                    Module.getMap().setTerrainEffect(0);   // 띠 색은 끄고 영상으로 본다
                    Module.getMap().setLighting(false);    // 힐셰이드가 영상에 들어 있으니 엔진 조명은 끔(기본 영상 얼룩 방지)
                    const [w, s, e, n] = dem.bounds;
                    loadMetaLayer(name, {
                        pathOverride: src.url, keepCamera: true,
                        meta: {
                            name, path: src.url, type: 'ETLT_PNG_IMAGE', file: 'png', iconKind: 'coverage',
                            level: { min: minL, max: maxL },
                            area: { min: { lon: w, lat: s, alt: 0 }, max: { lon: e, lat: n, alt: 0 } }
                        }
                    });
                } finally {
                    demColorBusy = false;
                }
            }
            terrainColorSmooth.addEventListener('change', () => {
                if (document.querySelector('input[name="terrainRenderMode"]:checked').value !== '1') return;
                if (terrainColorSmooth.checked) applyTerrainColor();
                else { removeDemColorLayer(); Module.getMap().setTerrainEffect(1); Module.getMap().setLighting(true); applyTerrainColor(); }
            });
            terrainColorShade.addEventListener('change', () => {
                if (terrainColorSmooth.checked && document.querySelector('input[name="terrainRenderMode"]:checked').value === '1') applyTerrainColor();
            });
            [terrainColorMin, terrainColorMax, terrainColorTheme, terrainColorSteps].forEach(el => el.addEventListener('change', () => {
                if (document.querySelector('input[name="terrainRenderMode"]:checked').value === '1') applyTerrainColor();
            }));
            terrainColorOpacity.addEventListener('input', () => {
                terrainColorOpacityText.textContent = parseFloat(terrainColorOpacity.value).toFixed(1);
                if (document.querySelector('input[name="terrainRenderMode"]:checked').value === '1') applyTerrainColor();
            });

            document.querySelectorAll('input[name="terrainRenderMode"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const val = parseInt(e.target.value);
                    terrainColorOptions.classList.toggle('open', val === 1);
                    Module.getMap().setTerrainEffect(val);
                    if (val === 1) {
                        // 띠 색상은 조명이 있어야 입체감이 남. 나갈 때 반드시 끈다(켠 채 두면 기본 영상에 타일 단위 음영 얼룩 = 깍두기, 실측)
                        Module.getMap().setLighting(!terrainColorSmooth.checked);
                        applyTerrainColor();
                    } else {
                        removeDemColorLayer();
                        Module.getMap().setLighting(false);
                        showTerrainLegend(val);
                    }
                });
            });

            // ---- DEM 배율 (드롭한 지형의 수직 과장) ----
            // 엔진의 Module.getTerrain().demRate는 쓰지 않는다: 셰이더가 |r|<1(평탄화)에서만 반응하고 1보다 크면
            // CPU 높이 조회만 커져 지형에 구멍이 난다(실측). 대신 메인의 /__xddem__/ 서버가 타일 높이값에 배율을 곱해
            // 응답하고(set-dem-scale), XDEPlanetRefresh로 타일을 다시 받게 한다. 기본 VWorld 지형에는 적용 불가.
            const demRateSlider = document.getElementById('demRateSlider');
            const demRateText = document.getElementById('demRateText');
            // currentDemScale / activeDemSource 는 스크립트 최상위(loadTileDbLayer 근처)에 선언 — loadMetaLayer도 쓴다
            let demScaleTimer = null;
            async function applyDemScale(scale) {
                scale = Math.max(0.1, Math.min(50, Number(scale) || 1));
                currentDemScale = scale;
                demRateText.textContent = scale.toFixed(1) + '×';
                if (Number(demRateSlider.value) !== scale) demRateSlider.value = Math.min(Number(demRateSlider.max), scale);
                if (activeDemSource) {
                    await window.electronAPI.setDemScale(activeDemSource.id, scale);
                    Module.XDEPlanetRefresh();   // 지형 타일 재요청
                    Module.XDRenderData();
                }
                return scale;
            }
            // 타일 LOD 비율 (엔진 Module.getMap().setTerrLODRatio, getter 없음). 실측: 2면 같은 카메라에서 레벨 11~12 타일이 2배 이상 요청됨
            const tileRatioSlider = document.getElementById('tileRatioSlider');
            const tileRatioText = document.getElementById('tileRatioText');
            let currentTileRatio = 1;
            function applyTileRatio(ratio) {
                ratio = Math.max(0.5, Math.min(8, Number(ratio) || 1));
                currentTileRatio = ratio;
                Module.getMap().setTerrLODRatio(ratio);
                Module.XDEPlanetRefresh();
                Module.XDRenderData();
                tileRatioText.textContent = ratio.toFixed(1) + '×';
                if (Number(tileRatioSlider.value) !== ratio) tileRatioSlider.value = Math.min(Number(tileRatioSlider.max), Math.max(Number(tileRatioSlider.min), ratio));
                return ratio;
            }
            let tileRatioTimer = null;
            tileRatioSlider.addEventListener('input', () => {
                tileRatioText.textContent = Number(tileRatioSlider.value).toFixed(1) + '×';
                clearTimeout(tileRatioTimer);
                tileRatioTimer = setTimeout(() => applyTileRatio(tileRatioSlider.value), 250);
            });

            // DEM 메시 업샘플 켜기/끄기 (서버 set-dem-upsample → 지형 재요청)
            const demSmoothToggle = document.getElementById('demSmoothToggle');
            async function applyDemSmooth(on) {
                demSmoothToggle.checked = !!on;
                const levels = await window.electronAPI.setDemUpsample(on ? 3 : 0);
                if (activeDemSource) { Module.XDEPlanetRefresh(); Module.XDRenderData(); }
                return levels;
            }
            demSmoothToggle.addEventListener('change', () => applyDemSmooth(demSmoothToggle.checked));

            demRateSlider.addEventListener('input', () => {
                // 드래그 중엔 표시만, 멈추면 적용 (타일 재요청이 비싸다)
                demRateText.textContent = Number(demRateSlider.value).toFixed(1) + '×';
                clearTimeout(demScaleTimer);
                demScaleTimer = setTimeout(() => applyDemScale(demRateSlider.value), 250);
            });

            // F12 콘솔용 헬퍼. 예) XDV.terrainColor(-6000, 4000) / XDV.terrainColor(0, 600, 'viridis', 0.8, 16) / XDV.terrainNormal() / XDV.demRate(4)
            //   인자: (최소 m, 최대 m, 테마, 불투명도 0~1, 단계 2~32 — 엔진이 앞 32색만 씀)
            //   테마: natural etopo1 relief globe topo terrain viridis turbo gray xd_standard xd_warm xd_sea xd_plant xd_sky
            window.XDV = Object.assign(window.XDV || {}, {
                // smooth: true면 DEM 색상 영상(연속 그라데이션+힐셰이드)으로 덮기, shade: 음영 배율(0/1/3/6/10)
                terrainColor(min, max, theme = 'natural', opacity = 1, steps = null, smooth = null, shade = null) {
                    if (smooth !== null) terrainColorSmooth.checked = !!smooth;
                    if (shade !== null && [...terrainColorShade.options].some(o => o.value === String(shade))) terrainColorShade.value = String(shade);
                    if (steps) {
                        const v = String(Math.min(TERRAIN_COLOR_MAX_STEPS, Math.max(2, parseInt(steps, 10) || 32)));
                        if (![...terrainColorSteps.options].some(o => o.value === v)) { const o = document.createElement('option'); o.value = v; o.textContent = v; terrainColorSteps.appendChild(o); }
                        terrainColorSteps.value = v;
                    }
                    if (Number.isFinite(min)) terrainColorMin.value = min;
                    if (Number.isFinite(max)) terrainColorMax.value = max;
                    if (TERRAIN_CMAPS[theme]) terrainColorTheme.value = theme;
                    terrainColorOpacity.value = Math.max(0, Math.min(1, opacity));
                    terrainColorOpacityText.textContent = parseFloat(terrainColorOpacity.value).toFixed(1);
                    const radio = document.querySelector('input[name="terrainRenderMode"][value="1"]');
                    radio.checked = true;
                    radio.dispatchEvent(new Event('change', { bubbles: true }));
                    return `terrain color ${terrainColorState.min}~${terrainColorState.max}m, ${terrainColorTheme.value}, ${getTerrainColorSteps()} steps, opacity ${terrainColorOpacity.value}`;
                },
                terrainNormal() {
                    const radio = document.querySelector('input[name="terrainRenderMode"][value="0"]');
                    radio.checked = true;
                    radio.dispatchEvent(new Event('change', { bubbles: true }));
                    return 'terrain normal';
                },
                // 타일 LOD 비율 (엔진 setTerrLODRatio). 슬라이더 1~4, 콘솔 0.5~8
                tileRatio(ratio = 1) {
                    return 'tile LOD ratio ' + applyTileRatio(ratio) + '×';
                },
                // DEM 메시 업샘플(3차 보간) 켜기/끄기
                async demSmooth(on = true) {
                    return 'DEM upsample levels ' + (await applyDemSmooth(on));
                },
                // 드롭한 DEM의 높이 배율. 슬라이더는 1~10, 콘솔에서는 0.1~50까지. DEM이 없으면 값만 기억해 두었다가 로드 시 적용
                async demRate(rate = 1) {
                    const v = await applyDemScale(rate);
                    return `DEM scale ${v}×` + (activeDemSource ? ` (${activeDemSource.name})` : ' (적용할 DEM 없음: 지형 sdb나 DEM 폴더를 먼저 올리세요)');
                }
            });

            // 지형단면도
            const terrainSliceToggle = document.getElementById('terrainSliceToggle');
            const terrainSliceStatus = document.getElementById('terrainSliceStatus');
            const terrainSliceChartCanvas = document.getElementById('terrainSliceChart');
            const terrainSliceArea = document.getElementById('terrain-slice-area');
            const sqlPanelArea = document.getElementById('sql-panel-area');
            const bottomTabSQL = document.getElementById('bottomTabSQL');
            const bottomTabSlice = document.getElementById('bottomTabSlice');

            let terrainSliceMode = false;
            let terrainSliceStartPos = null;
            window.window.terrainSliceChartObj = null;

            function loadChartJS(callback) {
                if (typeof Chart !== 'undefined') { callback(); return; }
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/chart.js';
                s.onload = callback;
                document.body.appendChild(s);
            }

            function switchBottomTab(tab) {
                if (tab === 'slice') {
                    bottomTabSQL.classList.remove('active');
                    bottomTabSlice.classList.add('active');
                    sqlPanelArea.style.display = 'none';

                    document.getElementById('terrainSliceClearBtn').style.display = '';
                    document.getElementById('sqlTableSelect').style.display = 'none';
                } else {
                    bottomTabSlice.classList.remove('active');
                    bottomTabSQL.classList.add('active');
                    terrainSliceArea.style.display = 'none';
                    sqlPanelArea.style.display = 'flex';
