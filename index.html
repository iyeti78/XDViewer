        // ============ 로컬 영상 타일 로딩 ============
        // XDWorld 배치(layer.meta)면 그대로, 세슘 피라미드면 재투영 후 영상 레이어로 로드

        // layer.json 읽기 (없거나 깨져 있으면 null)
        function readTileMeta(dirPath) {
            try {
                if (!window.electronAPI.listDir(dirPath).includes('layer.json')) return null;
                return window.electronAPI.readJsonFile(dirPath + '/layer.json');
            } catch (e) {
                return null;
            }
        }

        // 타일 피라미드 구조 탐지.
        // layer.json의 선언(tiles/format)은 실제와 다를 수 있으므로 디스크를 직접 확인한다.
        // (예: ctb가 만든 layer.json은 실제 png인데도 tiles를 ".terrain"으로 적어둠)
        function detectTilePyramid(dirPath) {
            const api = window.electronAPI;
            const IMG = /\.(png|jpe?g)$/i; // webp는 엔진 미지원 (nativeImage 디코딩 불가)

            const levels = api.listDir(dirPath)
                .filter(n => /^\d+$/.test(n) && api.isDirectory(dirPath + '/' + n))
                .map(Number)
                .sort((a, b) => a - b);
            if (levels.length === 0) return null;

            // 실제 이미지 타일이 존재하는 레벨만 수집 (빈 레벨 폴더 제외)
            const imageLevels = [];
            let ext = null;
            for (const lv of levels) {
                const lvDir = dirPath + '/' + lv;
                let found = null;
                for (const sub of api.listDir(lvDir)) {
                    const subDir = lvDir + '/' + sub;
                    if (!api.isDirectory(subDir)) continue;
                    found = api.listDir(subDir).find(n => IMG.test(n));
                    if (found) break;
                }
                if (found) {
                    imageLevels.push(lv);
                    if (!ext) ext = found.split('.').pop().toLowerCase();
                }
            }
            if (imageLevels.length === 0) return null;

            return { minLv: imageLevels[0], maxLv: imageLevels[imageLevels.length - 1], ext };
        }

        // 디스크의 타일 인덱스에서 데이터 경계를 구한다 (경계 밖은 요청하지 않도록).
        // 반환하는 y는 항상 XYZ(상단 원점) 기준 - 엔진이 요청하는 규약과 동일.
        function computeTileBounds(dirPath, level, scheme) {
            const api = window.electronAPI;
            const lvDir = dirPath + '/' + level;
            const xs = api.listDir(lvDir).filter(n => /^\d+$/.test(n)).map(Number);
            if (xs.length === 0) return null;

            let minY = Infinity, maxY = -Infinity;
            for (const x of xs) {
                for (const f of api.listDir(lvDir + '/' + x)) {
                    const m = f.match(/^(\d+)\./);
                    if (!m) continue;
                    const y = Number(m[1]);
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
            if (!isFinite(minY)) return null;

            // 'tms'(하단 원점) 데이터는 디스크 y를 XYZ(상단 원점)로 뒤집는다.
            // 'xyz' 데이터는 디스크 y가 이미 XYZ라 그대로 둔다. (resolveTilePath와 동일)
            if (scheme === 'tms') {
                const n = Math.pow(2, level);
                const lo = n - 1 - maxY;
                const hi = n - 1 - minY;
                minY = lo; maxY = hi;
            }

            return { level, minX: Math.min(...xs), maxX: Math.max(...xs), minY, maxY };
        }

        // 타일 인덱스(XYZ) 경계 -> EPSG:3857 미터 좌표 경계
        // XYZ는 y가 위에서 아래로 증가하므로 y축은 WM에서 빼야 한다
        function tileBoundsTo3857(b, WM) {
            const span = (2 * WM) / Math.pow(2, b.level);
            return {
                minX: -WM + b.minX * span,
                maxX: -WM + (b.maxX + 1) * span,
                minY: WM - (b.maxY + 1) * span,
                maxY: WM - b.minY * span
            };
        }

        // layer.json의 available(TMS 규약)과 실제 디스크 파일명을 비교해
        // 디스크 y가 XYZ(상단 원점)인지 TMS(하단 원점)인지 실측한다.
        // (세슘 layer.json은 schema를 "tms"라 적지만 실제 파일은 XYZ 번호라 문자열은 신뢰 불가)
        function detectDiskScheme(dirPath, level, available) {
            const api = window.electronAPI;
            const a = available && available[level] && available[level][0];
            if (!a) return null;

            const lvDir = dirPath + '/' + level;
            const xs = api.listDir(lvDir).filter(n => /^\d+$/.test(n));
            if (xs.length === 0) return null;

            let minY = Infinity, maxY = -Infinity;
            for (const f of api.listDir(lvDir + '/' + xs[0])) {
                const m = f.match(/^(\d+)\./);
                if (!m) continue;
                const y = Number(m[1]);
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
            if (!isFinite(minY)) return null;

            const n = Math.pow(2, level);
            const inRange = (lo, hi) => minY >= lo - 1 && maxY <= hi + 1;
            if (inRange(a.startY, a.endY)) return 'tms';                    // 디스크 y = TMS(하단)
            if (inRange(n - 1 - a.endY, n - 1 - a.startY)) return 'xyz';    // 디스크 y = XYZ(상단)
            return null;
        }

        // 타일 스킴 결정 (사용자 입력 없이 자동).
        // 'xyz' = 상단 원점(웹 표준/세슘), 'tms' = 하단 원점, 'vworld' = z/y/x
        function resolveTileScheme(dirPath, pyramid) {
            const meta = readTileMeta(dirPath);

            // available이 있으면 디스크 y 규약을 실측 (가장 정확)
            if (meta && Array.isArray(meta.available) && pyramid) {
                for (let lv = pyramid.maxLv; lv >= pyramid.minLv; lv--) {
                    const d = detectDiskScheme(dirPath, lv, meta.available);
                    if (d) return d;
                }
            }
            // layer.json의 schema 선언
            if (meta && typeof meta.schema === 'string') {
                const s = meta.schema.toLowerCase();
                if (s === 'xyz' || s === 'google') return 'xyz';
                if (s === 'tms') return 'tms';
            }
            // TMS 표준 메타파일
            if (window.electronAPI.listDir(dirPath).includes('tilemapresource.xml')) {
                return 'tms';
            }
            // 메타데이터 없음: 웹 표준(XYZ, 상단 원점)으로 가정
            console.warn('타일 스킴 메타데이터가 없어 XYZ(상단 원점)로 가정합니다. 상하 반전돼 보이면 TMS 데이터입니다.');
            return 'xyz';
        }

        // 피라미드의 경위도 경계: layer.json의 bounds 우선, 없으면 디스크 타일에서 산출
        function getPyramidBbox(dirPath, level, scheme) {
            const meta = readTileMeta(dirPath);
            if (meta && Array.isArray(meta.bounds) && meta.bounds.length >= 4) {
                const [west, south, east, north] = meta.bounds;
                return { west, south, east, north };
            }
            const tb = computeTileBounds(dirPath, level, scheme);
            if (!tb) return null;
            const WM = 20037508.342789244;
            const e = tileBoundsTo3857(tb, WM);
            const toLon = (x) => (x / WM) * 180;
            const toLat = (y) => {
                const a = (y / WM) * 180;
                return 180 / Math.PI * (2 * Math.atan(Math.exp(a * Math.PI / 180)) - Math.PI / 2);
            };
            return { west: toLon(e.minX), south: toLat(e.minY), east: toLon(e.maxX), north: toLat(e.maxY) };
        }

        // 세슘(EPSG:3857) 피라미드를 XDWorld(EPSG:4326) 영상 레이어로 재투영해 로드.
        // 결과는 vworld_png와 동일하게 배경지도 위에 겹쳐 그려진다.
        async function loadCesiumAsImageLayer(dirPath) {
            dirPath = dirPath.replace(/\\/g, '/');

            const pyramid = detectTilePyramid(dirPath);
            if (!pyramid) {
                alert('영상 타일을 찾지 못했습니다.\n\n숫자 레벨 폴더 안에 png/jpg 타일이 필요합니다.\n(webp는 아직 지원하지 않습니다)\n\n' + dirPath);
                return;
            }
            const scheme = resolveTileScheme(dirPath, pyramid);

            const bbox = getPyramidBbox(dirPath, pyramid.maxLv, scheme);
            if (!bbox) {
                alert('타일 경계를 구하지 못했습니다.\n\n' + dirPath);
                return;
            }

            const name = dirPath.split('/').filter(Boolean).pop() || 'imagery';

            // 요청 시마다 해당 타일만 재투영해 주는 로컬 서버를 붙인다 (사전 변환 없음)
            const src = await window.electronAPI.registerImageSource({
                kind: 'cesium', srcDir: dirPath, scheme: scheme, ext: pyramid.ext, srcMaxLv: pyramid.maxLv
            });

            console.log(`세슘 영상 등록: ${name} (소스 z ${pyramid.minLv}~${pyramid.maxLv}, scheme=${scheme})\n` +
                        `XDWorld level ${src.levels.minL}~${src.levels.maxL}\n${src.url}`);

            // layer.meta 파일 없이 메타 객체를 만들어 그대로 로드
            loadMetaLayer(dirPath + '/layer.json', {
                pathOverride: src.url,
                meta: {
                    name: name,
                    path: src.url,
                    type: 'ETLT_PNG_IMAGE',
                    file: 'png',
                    level: { min: src.levels.minL, max: src.levels.maxL },
                    area: {
                        min: { lon: bbox.west, lat: bbox.south, alt: 0 },
                        max: { lon: bbox.east, lat: bbox.north, alt: 0 }
                    }
                }
            });
        }


        // layer.json 드롭 시 같은 폴더를 타일 피라미드로 처리.
        // 영상/지형 판별은 layer.json 선언이 아니라 실제 타일 파일로 한다
        // (detectTilePyramid 가 이미지 타일이 없으면 걸러냄)
        function processLayerJson(filePath) {
            filePath = filePath.replace(/\\/g, '/');
            loadCesiumAsImageLayer(filePath.substring(0, filePath.lastIndexOf('/')));
        }

        // XDWorld 배치 폴더에서 실제 타일 확장자를 찾는다 (레벨 폴더 > IDY 폴더 > 파일)
        function detectXdTileExt(dirPath, minL) {
            const api = window.electronAPI;
            const lvDir = `${dirPath}/${minL}`;
            for (const idy of api.listDir(lvDir)) {
                if (!api.isDirectory(`${lvDir}/${idy}`)) continue;
                const f = api.listDir(`${lvDir}/${idy}`).find(n => /\.(png|jpe?g)$/i.test(n));
                if (f) return f.split('.').pop().toLowerCase();
            }
            return null;
        }

        // XDWorld 배치(layer.meta) 폴더 로드.
        // 엔진 영상 타일은 png만 읽으므로, jpg 타일이면 png로 변환한 캐시를 대신 로드한다.
        async function loadXdworldFolder(dirPath) {
            dirPath = dirPath.replace(/\\/g, '/');
            const metaPath = dirPath + '/layer.meta';

            let meta;
            try {
                meta = JSON.parse(await window.electronAPI.readMeta(metaPath));
            } catch (e) {
                alert('layer.meta를 읽지 못했습니다.\n\n' + (e.message || e));
                return;
            }

            const isImagery = meta.type === 'ETLT_PNG_IMAGE' || meta.type === 'ETLT_BASE_IMAGE';
            const ext = isImagery ? detectXdTileExt(dirPath, meta.level.min) : null;

            if (!isImagery || ext !== 'jpg' && ext !== 'jpeg') {
                loadMetaLayer(metaPath);
                return;
            }

            // jpg 타일은 엔진이 못 읽으므로, 요청 시마다 png로 변환해 주는 로컬 서버를 붙인다
            const src = await window.electronAPI.registerImageSource({ kind: 'xdjpg', srcDir: dirPath });
            console.log(`jpg 타일 감지 -> 요청 시 png 변환 (level ${meta.level.min}~${meta.level.max})\n${src.url}`);
            loadMetaLayer(metaPath, { pathOverride: src.url });
        }

        // ============ DEM 배율 상태 (분석 패널 슬라이더 ↔ loadMetaLayer 공유) ============
        let currentDemScale = 1;      // 드롭한 DEM 높이 배율. 서버(set-dem-scale)가 타일 값에 곱한다
        let activeDemSource = null;   // { id, name, bounds, minL, maxL } — 현재 demBox로 올라간 DEM 소스(로컬 서버 라우트)
        let demColorLayer = null;     // { id, name } — DEM 색상 영상 레이어(부드러운 그라데이션). 없으면 null

        // DEM 색상 영상 레이어 제거 (엔진 레이어 + 목록 항목 + 서버 소스)
        function removeDemColorLayer() {
            if (!demColorLayer) return;
            try { Module.XDEMapRemoveLayer(demColorLayer.name); } catch (e) { /* 이미 없음 */ }
            [...document.querySelectorAll('#interface .layer-item')].forEach(item => {
                const span = item.querySelector('span');
                if (span && span.textContent === demColorLayer.name) item.remove();
            });
            window.electronAPI.unregisterImageSource(demColorLayer.id);
            demColorLayer = null;
        }

        // ============ 레이어 목록 종류 아이콘 ============
        // 레이어 항목(체크박스 뒤)에 붙는 16px 선 아이콘. layer.meta type -> 종류 매핑은 LAYER_TYPE_ICON.
        const LAYER_ICONS = {
            imagery:    { title: '영상',        color: '#6cb0e6', svg: '<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><circle cx="5.5" cy="6.5" r="1.3"/><path d="M2 12.5l3.5-3.5 2.5 2.5 2.5-3 3.5 4"/>' },
            coverage:   { title: '표고 영상(회색조)', color: '#b0b8c0', svg: '<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M2 12.5l3-4.5 2.5 2.5 2-3 4.5 5"/>' },
            dem:        { title: '지형(DEM)',   color: '#c8a165', svg: '<path d="M1.5 13.5L6 5l2.5 4.5L10.5 7l4 6.5z"/><path d="M6 5l1.2 2.2"/>' },
            tiles3d:    { title: '3D Tiles',    color: '#e0b050', svg: '<path d="M8 1.5L14 5v6l-6 3.5L2 11V5z"/><path d="M2 5l6 3.5L14 5M8 8.5v6"/>' },
            model:      { title: '3D 모델',     color: '#e0b050', svg: '<path d="M8 1.5L14 5v6l-6 3.5L2 11V5z"/><path d="M2 5l6 3.5L14 5M8 8.5v6"/>' },
            real3d:     { title: '건물(Real3D)', color: '#e0b050', svg: '<path d="M2 14V6l4-2v10M6 14V4l5 2.5V14M11 14V8l3 1.5V14"/><path d="M1 14h14"/>' },
            vector:     { title: '벡터',        color: '#b48ead', svg: '<path d="M3 3l10 2-3 8-7-2z"/><circle cx="3" cy="3" r="1.2"/><circle cx="13" cy="5" r="1.2"/><circle cx="10" cy="13" r="1.2"/><circle cx="3" cy="11" r="1.2"/>' },
            points:     { title: '포인트',      color: '#ff8a65', svg: '<circle cx="4" cy="5" r="1.6"/><circle cx="11" cy="4" r="1.6"/><circle cx="7" cy="11" r="1.6"/><circle cx="12.5" cy="11.5" r="1.6"/>' },
            pipe:       { title: '파이프',      color: '#8fbcbb', svg: '<path d="M2 5h6a3 3 0 0 1 3 3v6"/><path d="M2 9h6a3 3 0 0 1 3 3v2" opacity=".5"/>' },
            pointcloud: { title: '포인트 클라우드', color: '#a3be8c', svg: '<circle cx="3" cy="4" r="1"/><circle cx="7" cy="3" r="1"/><circle cx="11" cy="5" r="1"/><circle cx="5" cy="8" r="1"/><circle cx="9" cy="8" r="1"/><circle cx="13" cy="9" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="8" cy="12" r="1"/><circle cx="12" cy="13" r="1"/>' }
        };
        const LAYER_TYPE_ICON = {
            ETLT_PNG_IMAGE: 'imagery', ETLT_BASE_IMAGE: 'imagery', ETLT_TERRAIN_IMAGE: 'imagery',
            ETLT_BASE_DEM: 'dem', ETLT_VECTOR_PIPE: 'pipe', ETLT_POINT_CLOUD: 'pointcloud',
            ETLT_REAL3D: 'real3d', ETLT_3DPOINT: 'points'
        };
        function makeLayerIcon(kind) {
            const def = LAYER_ICONS[kind] || LAYER_ICONS.imagery;
            const el = document.createElement('i');
            el.className = 'layer-icon';
            el.title = def.title;
            el.style.color = def.color;
            el.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">${def.svg}</svg>`;
            return el;
        }

        // SQLite 타일 패키지(GeoPackage / XDWorld sdb) 로드.
        // 격자가 XDWorld(4326, 10x5)라 재투영 없이 메인의 로컬 서버가 blob을 꺼내 응답한다.
        // blob이 png/jpg면 영상 레이어, gzip(bil)이면 지형(demBox)으로 올린다.
        // 3857 격자·TIFF 지형·미지원 포맷은 메인이 error 문자열로 돌려주므로 안내만 한다.
        async function loadTileDbLayer(filePath) {
            filePath = filePath.replace(/\\/g, '/');
            const src = await window.electronAPI.registerImageSource({ kind: 'sqlite', file: filePath });
            if (src.error) {
                alert(`타일 DB를 영상 레이어로 열 수 없습니다.\n\n${filePath}\n\n${src.error}`);
                return;
            }

            const name = filePath.split('/').pop().replace(/\.(gpkg|sdb|sqlite)$/i, '');
            const { kind, schema, format, bounds, minL, maxL, tileSize } = src.info;
            const [west, south, east, north] = bounds;
            const isTerrain = kind === 'terrain';
            if (!isTerrain && tileSize !== 256) console.warn(`타일 크기가 256이 아닙니다: ${tileSize}px (${name})`);
            const kindLabel = isTerrain ? '지형' : kind === 'coverage' ? '표고 회색조 영상' : '영상';
            console.log(`타일 DB 등록: ${name} (${kindLabel}, ${schema}, ${format}, level ${minL}~${maxL})\n${src.url}`);

            // 전구(또는 반구 이상) 범위 데이터는 중심(0,0 부근 바다)으로 카메라를 옮기는 게 무의미하므로 현재 시점을 유지
            const keepCamera = (east - west) >= 180;
            if (keepCamera) console.log(`범위가 ${(east - west).toFixed(0)}°라 카메라를 이동하지 않습니다 (${name})`);

            // layer.meta 없이 메타 객체를 만들어 기존 경로(영상 레이어 / ETLT_BASE_DEM demBox)로 로드
            loadMetaLayer(filePath, {
                pathOverride: src.url,
                keepCamera: keepCamera,
                demSourceId: isTerrain ? src.id : undefined,
                meta: {
                    name: name,
                    path: src.url,
                    type: isTerrain ? 'ETLT_BASE_DEM' : 'ETLT_PNG_IMAGE',
                    file: isTerrain ? 'bil' : 'png',
                    iconKind: isTerrain ? 'dem' : kind === 'coverage' ? 'coverage' : 'imagery',
                    level: { min: minL, max: maxL },
                    area: {
                        min: { lon: west, lat: south, alt: 0 },
                        max: { lon: east, lat: north, alt: 0 }
                    }
                }
            });
        }

        // 드롭된 폴더 처리: layer.meta / tileset.json / 영상 타일 피라미드
        function processDroppedFolder(dirPath) {
            dirPath = dirPath.replace(/\\/g, '/');
            const entries = window.electronAPI.listDir(dirPath);

            if (entries.includes('layer.meta')) {
                loadXdworldFolder(dirPath);                  // XDWorld 배치 (jpg면 png로 변환 후 로드)
            } else if (entries.includes('tileset.json')) {
                processFilePath(dirPath + '/tileset.json');   // 3D Tiles
            } else {
                loadCesiumAsImageLayer(dirPath);              // 세슘 피라미드 -> 재투영 후 영상 레이어
            }
        }

        // 엔진(Module) 준비 전 도착한 파일 경로 대기 큐
        // (앱 꺼진 상태에서 layer.meta 더블클릭 시 엔진 초기화 전에 경로가 도착함)
        let engineReady = false;
        const pendingFilePaths = [];
        function flushPendingFilePaths() {
            engineReady = true;
            while (pendingFilePaths.length > 0) {
                processFilePath(pendingFilePaths.shift());
            }
        }

        // Electron에서 파일 경로 수신 시 처리
        window.electronAPI.onFilePathReceived((event, filePaths) => {
            // 여러 파일을 받을 수 있도록 filePaths 배열로 처리
            if (!Array.isArray(filePaths)) {
                filePaths = [filePaths];
            }
            filePaths.forEach((fp) => {
                if (engineReady) {
                    processFilePath(fp);
                } else {
                    pendingFilePaths.push(fp);
                }
            });
        });

        // 파일 선택 버튼 클릭 시 메인 프로세스에 파일 선택 요청
        document.getElementById('openLayer').addEventListener('click', async () => {

            window.electronAPI.openFileDialog({
                filters: [
                    { name: 'JSON/GeoJSON Files', extensions: ['json', 'geojson'] },
                    { name: 'Layer', extensions: ['meta'] }
                ],
                properties: ['openFile']
            }); // 메인 프로세스의 파일 선택 다이얼로그 호출
        });

        // ============ 경로/URL 텍스트로 레이어 추가 ============
        // 드롭 대신 텍스트 한 줄로 받는다.
        //   로컬 절대경로(파일·폴더, 역슬래시 OK) / file:// URL  → 드롭과 같은 분기(processDroppedFolder / processFilePath)
        //   http(s) URL: tileset.json → 3D Tiles, layer.meta → 원격 XDWorld 레이어(path를 URL 폴더로 바꿔 엔진이 HTTP로 타일 요청),
        //               .geojson/.json → GeoJSON
        async function loadFromInput(raw) {
            let text = (raw || '').trim().replace(/^["']|["']$/g, '');
            if (!text) return;

            if (/^file:\/\//i.test(text)) {
                try {
                    text = decodeURIComponent(text.replace(/^file:\/{2,3}/i, '')).replace(/^\/([A-Za-z]:)/, '$1');
                } catch (e) { /* 그대로 둔다 */ }
            }

            if (/^https?:\/\//i.test(text)) {
                const url = text.split('#')[0];
                const pathPart = url.split('?')[0];
                const lower = pathPart.toLowerCase();
                const name = decodeURIComponent(pathPart.split('/').pop());
                const baseUrl = pathPart.substring(0, pathPart.lastIndexOf('/'));

                if (lower.endsWith('tileset.json')) {
                    processFilePath(url);
                    return;
                }
                if (lower.endsWith('.meta')) {
                    let meta;
                    try {
                        meta = JSON.parse(await window.electronAPI.fetchText(url));
                    } catch (e) {
                        alert(`layer.meta를 받지 못했습니다.\n\n${url}\n\n${e.message || e}`);
                        return;
                    }
                    meta.path = baseUrl; // 파일의 path는 서버 로컬 경로라 URL 폴더로 대체
                    console.log(`원격 layer.meta: ${meta.name} (${meta.type}) <- ${baseUrl}`);
                    loadMetaLayer(url, { meta: meta, pathOverride: baseUrl });
                    return;
                }
                if (lower.endsWith('.geojson') || lower.endsWith('.json')) {
                    let data;
                    try {
                        data = JSON.parse(await window.electronAPI.fetchText(url));
                    } catch (e) {
                        alert(`GeoJSON을 받지 못했습니다.\n\n${url}\n\n${e.message || e}`);
                        return;
                    }
                    if (!data || !data.features || !data.features.length) {
                        alert('GeoJSON에 feature가 없습니다.\n\n' + url);
                        return;
                    }
                    loadGeojsonLayerFromData(name.replace(/\.(geo)?json$/i, ''), data.features[0].geometry.type, data);
                    return;
                }
                alert('지원하지 않는 URL입니다.\n\n' + url + '\n\n지원: tileset.json, layer.meta, .geojson');
                return;
            }

            // 로컬 절대경로: 드롭과 같은 분기
            const p = text.replace(/\\/g, '/').replace(/\/+$/, '');
            if (!window.electronAPI.pathExists(p)) {
                alert('경로를 찾을 수 없습니다.\n\n' + text);
                return;
            }
            if (window.electronAPI.isDirectory(p)) {
                processDroppedFolder(p);
            } else if (isValidFileType(p)) {
                processFilePath(p);
            } else {
                alert('지원하지 않는 파일 형식입니다.\n\n' + text + '\n\n허용: .geojson, .csv, .meta, .gpkg, .sdb, tileset.json, .glb/.gltf, .3ds');
            }
        }

        function addLayerFromInput() {
            const input = document.getElementById('tilesetUrlInput');
            const text = input.value.trim();
            if (!text) return;
            loadFromInput(text).then(() => { input.value = ''; });
        }
        document.getElementById('addUrlBtn').addEventListener('click', addLayerFromInput);
        document.getElementById('tilesetUrlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addLayerFromInput();
        });

        // 드래그 앤 드롭 기능 추가
        // Document 레벨에서 기본 드래그 동작 방지 (Electron에서 필수)
        document.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        }, false);

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
        }, false);

        // body 전체에 드래그 앤 드롭 적용
        const dropZone = document.body;

        const dropOverlay = document.getElementById('dropOverlay');
        let dragEnterCount = 0;

        // dragenter 이벤트 추가
        dropZone.addEventListener('dragenter', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dragEnterCount++;
            dropOverlay.classList.add('active');
        }, false);

        // 드래그 오버 시 기본 동작 방지
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
        }, false);

        // 드래그가 영역을 떠날 때 오버레이 제거
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dragEnterCount--;
            if (dragEnterCount <= 0) {
                dragEnterCount = 0;
                dropOverlay.classList.remove('active');
            }
        }, false);

        // 파일 확장자 검증 함수
        function isValidFileType(filePath) {
            const validExtensions = ['.geojson', '.meta', '.las', '.tif', '.tiff', '.csv', '.glb', '.gltf', '.3ds', '.gpkg', '.sdb', '.sqlite'];
            const fileName = filePath.toLowerCase();

            // tileset.json / layer.json 체크
            if (fileName.endsWith('tileset.json') || fileName.endsWith('layer.json')) {
                return true;
            }

            // 다른 허용 확장자 체크
            return validExtensions.some(ext => fileName.endsWith(ext));
        }

        // 파일 드롭 시 처리
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dragEnterCount = 0;
            dropOverlay.classList.remove('active');

            const files = e.dataTransfer.files;
            console.log('Dropped files:', files.length);

            if (files && files.length > 0) {
                let validFileCount = 0;
                let invalidFiles = [];

                // Electron의 webUtils를 사용하여 파일 경로 가져오기
                Array.from(files).forEach(file => {
                    const filePath = window.electronAPI.getPathForFile(file);
                    console.log('File path:', filePath);

                    if (filePath) {
                        // 폴더면 구조를 검사해 분기 (영상 타일 / layer.meta / 3D Tiles)
                        if (window.electronAPI.isDirectory(filePath)) {
                            processDroppedFolder(filePath);
                            validFileCount++;
                        } else if (isValidFileType(filePath)) {
                            processFilePath(filePath);
                            validFileCount++;
                        } else {
                            invalidFiles.push(file.name);
                        }
                    }
                });

                // 유효하지 않은 파일이 있으면 알림
                if (invalidFiles.length > 0) {
                    alert('지원하지 않는 파일 형식입니다.\n허용된 파일: .geojson, .csv, .meta, .gpkg, .sdb, tileset.json\n\n잘못된 파일:\n' + invalidFiles.join('\n'));
                }

                console.log(`Valid files processed: ${validFileCount}, Invalid files: ${invalidFiles.length}`);
            } else {
                // 브라우저 주소창·텍스트에서 끌어온 URL/경로
                const txt = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
                const line = (txt || '').split(/\r?\n/).find(l => l.trim() && !l.startsWith('#'));
                if (line) loadFromInput(line);
            }
        }, false);

        function createPointObjects(layer, features, altitude, color, customIconUrl, pointSize = 10) {
            var layerName = layer.getName();

            if (customIconUrl) {
                // 커스텀 아이콘 사용 - Symbol 시스템으로 아이콘 등록
                const iconName = layerName + '_custom_' + Date.now();
                const img = new Image();

                img.onload = function () {
                    // 점 크기에 따라 캔버스 크기 조정
                    const canvasSize = Math.max(48, pointSize * 2);
                    const canvas = document.createElement('canvas');
                    canvas.width = canvasSize;
                    canvas.height = canvasSize;
                    const ctx = canvas.getContext('2d');

                    // 투명 배경
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // 이미지를 비율에 맞춰 중앙에 그리기
                    const maxSize = Math.max(40, pointSize * 1.6);
                    const imgWidth = img.width;
                    const imgHeight = img.height;
                    const aspectRatio = imgWidth / imgHeight;

                    let drawWidth, drawHeight, offsetX, offsetY;

                    if (aspectRatio > 1) {
                        // 가로가 더 긴 경우
                        drawWidth = maxSize;
                        drawHeight = maxSize / aspectRatio;
                    } else {
                        // 세로가 더 긴 경우 (핀 등)
                        drawHeight = maxSize;
                        drawWidth = maxSize * aspectRatio;
                    }

                    offsetX = (canvas.width - drawWidth) / 2;
                    offsetY = (canvas.height - drawHeight) / 2;

                    ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                    // Symbol 시스템에 아이콘 등록
                    if (Module.getSymbol().insertIcon(iconName, imageData.data, canvas.width, canvas.height)) {

                // 점 그리기

                // Symbol 시스템에 아이콘 등록

        function createLineObjects(layer, features, altitude, color, width = 3.0, transparency = 0) {
            for (let i = 0; i < features.length; i++) {
                try {
                    const feature = features[i];
                    const geometry = feature.geometry;
                    if (!geometry || !geometry.coordinates) continue;

                    const id = feature.id || `GEOJSON_LINE_${i}`;
                    const line = Module.createLineString(id);

                    const vertexList = new Module.JSVec3Array();
                    const partList = new Module.Collection();

                    if (geometry.type === "LineString") {
                        partList.addItem(geometry.coordinates.length);
                        geometry.coordinates.forEach(coord => {
                            const x = coord[0], y = coord[1], z = coord[2] ?? altitude;
                            vertexList.push(new Module.JSVector3D(x, y, z + 1.5));
                        });
                    }
                    else if (geometry.type === "MultiLineString") {
                        for (const part of geometry.coordinates) {
                            partList.add(part.length);
                            for (const coord of part) {
                                const x = coord[0], y = coord[1], z = coord[2] ?? altitude;
                                vertexList.push(new Module.JSVector3D(x, y, z + 1.5));
                            }
                        }
                    }
                    // 스타일 지정
                    var style = new Module.JSPolyLineStyle();
                    style.setWidth(width);
                    const rgb = colorStringToRGB(color);
                    // 투명도를 Alpha 값으로 변환: 투명도 0% = Alpha 255, 투명도 100% = Alpha 0
                    const alpha = Math.round(255 - (transparency * 2.55));
                    console.log('라인 색상 (원본):', color, '→ RGB:', rgb, '투명도:', transparency + '%', '→ Alpha:', alpha, '두께:', width);
                    // JSColor는 ARGB 순서: (Alpha, Red, Green, Blue)
                    style.setColor(new Module.JSColor(alpha, rgb[0], rgb[1], rgb[2]));
                    line.setStyle(style);

                    line.setPartCoordinates(vertexList, partList);
                    layer.addObject(line, 0);
                } catch (e) {
                    console.error(`라인 ${i} 생성 오류:`, e.message);
                }
            }
            layer.rebuildObjectLayer();
        }

        function createPolygonObjects(layer, features, altitude, color, strokeColor, fillTransparency = 0, strokeTransparency = 0) {
            for (let i = 0; i < features.length; i++) {
                try {
                    const feature = features[i];
                    const geometry = feature.geometry;
                    if (!geometry || !geometry.coordinates) continue;

                    const id = feature.id || `GEOJSON_POLY_${i}`;

                    if (geometry.type === "Polygon") {
                        createSinglePolygon(id, geometry.coordinates, color, altitude, layer, strokeColor, fillTransparency, strokeTransparency);
                    }
                    else if (geometry.type === "MultiPolygon") {
                        for (let j = 0; j < geometry.coordinates.length; j++) {
                            const partId = `${id}_part${j}`;
                            createSinglePolygon(partId, geometry.coordinates[j], color, altitude, layer, strokeColor, fillTransparency, strokeTransparency);
                        }
                    }
                } catch (e) {
                    console.error(`폴리곤 ${i} 생성 오류:`, e.message);
                }
            }
            layer.rebuildObjectLayer();
        }

        function createSinglePolygon(id, rings, color, altitude, layer, strokeColor, fillTransparency = 0, strokeTransparency = 0) {
            const polygon = Module.createPolygon(id);
            const allVertices = new Module.Collection();

            // 외곽선만 추가 (내부 링은 무시)
            const outerRing = rings[0];
            outerRing.forEach(coord => {
                const x = coord[0], y = coord[1], z = coord[2] ?? altitude;
                allVertices.add(new Module.JSVector3D(x, y, z + 1.5));
            });

            const style = new Module.JSPolygonStyle();
            style.setFill(true);
            const fillRGB = colorStringToRGB(color);
            // 투명도를 Alpha 값으로 변환: 투명도 0% = Alpha 255, 투명도 100% = Alpha 0
            const fillAlpha = Math.round(255 - (fillTransparency * 2.55));
            console.log('폴리곤 면 색상 (원본):', color, '→ RGB:', fillRGB, '투명도:', fillTransparency + '%', '→ Alpha:', fillAlpha);
            // JSColor는 ARGB 순서: (Alpha, Red, Green, Blue)
            style.setFillColor(new Module.JSColor(fillAlpha, fillRGB[0], fillRGB[1], fillRGB[2]));

            // 라인 색상 설정
            if (strokeColor) {
                const strokeRGB = colorStringToRGB(strokeColor);
                const strokeAlpha = Math.round(255 - (strokeTransparency * 2.55));
                console.log('폴리곤 선 색상 (원본):', strokeColor, '→ RGB:', strokeRGB, '투명도:', strokeTransparency + '%', '→ Alpha:', strokeAlpha);
                try {
                    // 폴리곤 외곽선을 그리려면 setOutLine을 먼저 호출해야 할 수 있음
                    if (typeof style.setOutLine === 'function') {
                        style.setOutLine(true);
                        console.log('setOutLine(true) 호출 성공');
                    }

                    // JSColor는 ARGB 순서: (Alpha, Red, Green, Blue)
                    const lineColor = new Module.JSColor(strokeAlpha, strokeRGB[0], strokeRGB[1], strokeRGB[2]);

                    // 매뉴얼에 따라 setOutLineColor 메서드 사용 (대문자 L)
                    if (typeof style.setOutLineColor === 'function') {
                        style.setOutLineColor(lineColor);
                        console.log('setOutLineColor 호출 성공');
                    } else if (typeof style.setOutlineColor === 'function') {
                        style.setOutlineColor(lineColor);
                        console.log('setOutlineColor 호출 성공');
                    } else if (typeof style.setStrokeColor === 'function') {
                        style.setStrokeColor(lineColor);
                        console.log('setStrokeColor 호출 성공');
                    } else if (typeof style.setLineColor === 'function') {
                        style.setLineColor(lineColor);
                        console.log('setLineColor 호출 성공');
                    } else {
                        console.log('폴리곤 선 색상 설정 메서드를 찾을 수 없음');
                    }

                    if (typeof style.setOutLineWidth === 'function') {
                        style.setOutLineWidth(2.0);
                        console.log('폴리곤 선 두께 설정 완료 - OutLineWidth: 2.0');
                    } else if (typeof style.setLineWidth === 'function') {
                        style.setLineWidth(2.0);
                        console.log('폴리곤 선 두께 설정 완료 - LineWidth: 2.0');
                    } else if (typeof style.setOutlineWidth === 'function') {
                        style.setOutlineWidth(2.0);
                        console.log('폴리곤 선 두께 설정 완료 - OutlineWidth: 2.0');
                    }
                } catch (e) {
                    console.error('폴리곤 선 설정 오류:', e.message);
                }
            } else {
                console.log('strokeColor가 제공되지 않음');
            }

            polygon.setStyle(style);
            polygon.setCoordinates(allVertices);

            layer.addObject(polygon, 0);
        }

        function colorStringToRGB(rgbaStr) {
            // 예: "rgba(123, 234, 45, 1.0)" → [123, 234, 45]
            const matches = rgbaStr.match(/\d+(\.\d+)?/g);
            if (!matches || matches.length < 3) return [0, 0, 0];
            return [parseInt(matches[0]), parseInt(matches[1]), parseInt(matches[2])];
        }

        // XDWorld에서 사용하는 BGR 색상을 RGB rgba 문자열로 변환
        function convertToBGRColor(rgbaStr) {
            // XDWorld는 BGR 순서를 사용하므로, 실제 지도에 그려지는 색상을 반환
            const rgb = colorStringToRGB(rgbaStr);
            // R과 B를 교체 (BGR로 변환된 결과를 RGB로 다시 표현)
            return `rgba(${rgb[2]}, ${rgb[1]}, ${rgb[0]}, 1.0)`;
        }

        function getMarkerIcon(_id, _color, returnDataUrl, type, transparency = 0, strokeColor = null, strokeTransparency = 0) {
            var canvas = document.createElement('canvas');
            var size = 16;
            canvas.width = size;
            canvas.height = size;

            var ctx = canvas.getContext('2d');

            if (type == 0) {
                // 점
                const alpha = 1.0 - (transparency / 100);
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(size / 2, size / 2, size / 4, 0, 2 * Math.PI, false);
                ctx.fillStyle = _color;
                ctx.fill();
            } else if (type == 1) {
                // 선
                const alpha = 1.0 - (transparency / 100);
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.moveTo(0, size / 2);
                ctx.lineTo(size, size / 2);
                ctx.strokeStyle = _color;
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (type == 2) {
                // 폴리곤 (면 + 선을 각각 다른 투명도로)
                ctx.beginPath();
                ctx.moveTo(2, 2);
                ctx.lineTo(size - 2, 2);
                ctx.lineTo(size - 2, size - 2);
                ctx.lineTo(2, size - 2);
                ctx.closePath();

                // 면 먼저 그리기 (면 투명도 적용)
                const fillAlpha = 1.0 - (transparency / 100);
                ctx.globalAlpha = fillAlpha;
                ctx.fillStyle = _color;
                ctx.fill();

                // 선 그리기 (선 색상과 투명도 적용)
                if (strokeColor) {
                    const strokeAlpha = 1.0 - (strokeTransparency / 100);
                    ctx.globalAlpha = strokeAlpha;
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }


            if (returnDataUrl) {
                return canvas.toDataURL();
            }

            if (Module.getSymbol().insertIcon(_id, ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height)) {
                return Module.getSymbol().getIcon(_id);
            }
            return null;
        }



        // ============ CSV 처리 ============

        // CSV 텍스트를 2D 배열로 파싱
        function parseCSV(text) {
            const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            const result = [];
            for (const line of lines) {
                if (line.trim() === '') continue;
                // 쉼표 구분, 큰따옴표 내 쉼표 처리
                const row = [];
                let cell = '';
                let inQuote = false;
                for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    if (inQuote) {
                        if (ch === '"' && line[i + 1] === '"') {
                            cell += '"';
                            i++;
                        } else if (ch === '"') {
                            inQuote = false;
                        } else {
                            cell += ch;
                        }
                    } else {
                        if (ch === '"') {
                            inQuote = true;
                        } else if (ch === ',') {
                            row.push(cell.trim());
                            cell = '';
                        } else {
                            cell += ch;
                        }
                    }
                }
                row.push(cell.trim());
                result.push(row);
            }
            return result;
        }

        // 컬럼명으로 경도/위도/이름 후보 자동 감지
        function detectColumns(headers, rows) {
            const lonKeywords = ['경도', 'lon', 'longitude', 'lng', 'x', 'long'];
            const latKeywords = ['위도', 'lat', 'latitude', 'y'];
            const nameKeywords = ['이름', 'name', '명칭', '시설명', '상호', '건물명', '지점명', 'title', 'label'];
            const valueKeywords = ['값', 'value', '수량', '인구', '금액', 'count', 'amount', '건수', '면적', '비율', 'total', 'sum', 'avg', '평균', '합계'];

            let lonIdx = -1, latIdx = -1, nameIdx = -1, valueIdx = -1;
            const lower = headers.map(h => h.toLowerCase());

            for (let i = 0; i < lower.length; i++) {
                for (const kw of lonKeywords) {
                    if (lower[i].includes(kw) && lonIdx === -1) { lonIdx = i; break; }
                }
                for (const kw of latKeywords) {
                    if (lower[i].includes(kw) && latIdx === -1) { latIdx = i; break; }
                }
                for (const kw of nameKeywords) {
                    if (lower[i].includes(kw) && nameIdx === -1) { nameIdx = i; break; }
                }
                for (const kw of valueKeywords) {
                    if (lower[i].includes(kw) && valueIdx === -1) { valueIdx = i; break; }
                }
            }

            // 키워드로 값 컬럼을 못 찾으면, 80% 이상 숫자인 컬럼 자동 감지 (lon/lat 제외)
            if (valueIdx === -1 && rows && rows.length > 0) {
                for (let i = 0; i < headers.length; i++) {
                    if (i === lonIdx || i === latIdx) continue;
                    let numCount = 0;
                    const sampleRows = rows.slice(0, Math.min(20, rows.length));
                    for (const row of sampleRows) {
                        if (row[i] !== undefined && row[i] !== '' && !isNaN(Number(row[i]))) numCount++;
                    }
                    if (numCount / sampleRows.length >= 0.8) { valueIdx = i; break; }
                }
            }

            return { lonIdx, latIdx, nameIdx, valueIdx };
        }

        // CSV 컬럼 선택 모달 표시
        function showCsvColumnModal(headers, rows, fileName) {
            return new Promise((resolve) => {
                const modal = document.getElementById('csvModal');
                const colLon = document.getElementById('csvColLon');
                const colLat = document.getElementById('csvColLat');
                const colName = document.getElementById('csvColName');
                const info = document.getElementById('csvModalInfo');
                const previewTable = document.getElementById('csvPreviewTable');

                // 정보 표시
                info.textContent = `파일: ${fileName} | 전체 ${rows.length}건 | 컬럼 ${headers.length}개`;

                // 셀렉트 옵션 생성
                function fillSelect(select, defaultIdx, allowNone) {
                    select.innerHTML = '';
                    if (allowNone) {
                        const opt = document.createElement('option');
                        opt.value = '-1';
                        opt.textContent = '(없음)';
                        select.appendChild(opt);
                    }
                    headers.forEach((h, i) => {
                        const opt = document.createElement('option');
                        opt.value = i;
                        opt.textContent = `[${i}] ${h}`;
                        select.appendChild(opt);
                    });
                    if (defaultIdx >= 0) select.value = defaultIdx;
                }

                const detected = detectColumns(headers);
                fillSelect(colLon, detected.lonIdx, false);
                fillSelect(colLat, detected.latIdx, false);
                fillSelect(colName, detected.nameIdx, true);

                // 미리보기 테이블
                function updatePreview() {
                    const li = parseInt(colLon.value);
                    const la = parseInt(colLat.value);
                    const na = parseInt(colName.value);
                    let html = '<tr>';
                    html += `<th>#</th>`;
                    if (na >= 0) html += `<th>${headers[na]}</th>`;
                    html += `<th>${headers[li] || '경도'}</th>`;
                    html += `<th>${headers[la] || '위도'}</th>`;
                    html += '</tr>';
                    const previewRows = rows.slice(0, 5);
                    previewRows.forEach((row, i) => {
                        html += '<tr>';
                        html += `<td>${i + 1}</td>`;
                        if (na >= 0) html += `<td>${row[na] || ''}</td>`;
                        html += `<td>${row[li] || ''}</td>`;
                        html += `<td>${row[la] || ''}</td>`;
                        html += '</tr>';
                    });
                    previewTable.innerHTML = html;
                }
                updatePreview();
                colLon.onchange = updatePreview;
                colLat.onchange = updatePreview;
                colName.onchange = updatePreview;

                modal.style.display = 'flex';

                function cleanup() {
                    modal.style.display = 'none';
                    document.getElementById('csvModalOk').onclick = null;
                    document.getElementById('csvModalCancel').onclick = null;
                    document.getElementById('csvModalClose').onclick = null;
                }

                document.getElementById('csvModalOk').onclick = () => {
                    cleanup();
                    resolve({
                        lonIdx: parseInt(colLon.value),
                        latIdx: parseInt(colLat.value),
                        nameIdx: parseInt(colName.value)
                    });
                };
                document.getElementById('csvModalCancel').onclick = () => { cleanup(); resolve(null); };
                document.getElementById('csvModalClose').onclick = () => { cleanup(); resolve(null); };
            });
        }

        // CSV 파일 로드 및 Point 레이어 생성
        async function loadCsvLayer(filePath) {
            const csvText = window.electronAPI.readCsvFile(filePath);
            if (!csvText) {
                alert('CSV 파일을 읽을 수 없습니다.');
                return;
            }

            const parsed = parseCSV(csvText);
            if (parsed.length < 2) {
                alert('CSV 데이터가 부족합니다. (헤더 + 최소 1행 필요)');
                return;
            }

            const headers = parsed[0];
            const rows = parsed.slice(1);
            const fileName = filePath.split(/[\/\\]/).pop().replace('.csv', '');

            // SQLite에 데이터 저장
            if (sqlReady) {
                const sqlTable = importCsvToSqlite(fileName, headers, rows);
                if (sqlTable) {
                    showBottomPanel();
                    document.getElementById('sqlTableSelect').value = sqlTable;
                    runDefaultQuery(sqlTable);
                }
            }

            // 컬럼 선택 모달 표시
            const selection = await showCsvColumnModal(headers, rows, fileName);
            if (!selection) return; // 취소

            const { lonIdx, latIdx, nameIdx } = selection;

            // GeoJSON features로 변환
            const features = [];
            let skipped = 0;
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                const lon = parseFloat(row[lonIdx]);
                const lat = parseFloat(row[latIdx]);
                if (isNaN(lon) || isNaN(lat)) { skipped++; continue; }
                // 경위도 범위 체크
                if (lon < -180 || lon > 180 || lat < -90 || lat > 90) { skipped++; continue; }

                const name = nameIdx >= 0 ? (row[nameIdx] || '') : `Point_${i}`;
                features.push({
                    id: `CSV_POINT_${i}`,
                    geometry: { type: 'Point', coordinates: [lon, lat, 30] },
                    properties: { name: name }
                });
            }

            if (features.length === 0) {
                alert('유효한 좌표가 없습니다.\n건너뛴 행: ' + skipped);
                return;
            }

            if (skipped > 0) {
                console.log(`CSV 로드 완료: ${features.length}건 성공, ${skipped}건 건너뜀`);
            }

            // GeoJSON 형태의 데이터 객체 생성하여 기존 레이어 생성 로직 재사용
            const data = { features: features };
            loadGeojsonLayerFromData(fileName, 'Point', data, true);
        }

        function loadGeojsonLayer(filePath) {
            const fileName = filePath.split(/[\/]/).pop().replace('.geojson', '');
            window.electronAPI.readGeoJSON(filePath).then(function (data) {
                if (!data || !data.features || data.features.length === 0) {
                    alert("GeoJSON에 feature가 없습니다.");
                    return;
                }
                const type = data.features[0].geometry.type;
                loadGeojsonLayerFromData(fileName, type, data);
            }).catch(err => {
                console.error("GeoJSON 파일 로드 오류:", err);
                console.error("파일명:", fileName);
            });
        }

        function loadGeojsonLayerFromData(fileName, type, data, skipSqlImport = false) {
                // SQLite에 GeoJSON 데이터 저장 (CSV에서 호출된 경우 skip)
                if (!skipSqlImport && sqlReady && data.features) {
                    const sqlTable = importGeoJsonToSqlite(fileName, data.features);
                    if (sqlTable) {
                        showBottomPanel();
                        document.getElementById('sqlTableSelect').value = sqlTable;
                        runDefaultQuery(sqlTable);
                    }
                }

                const layerList = new Module.JSLayerList(true);
                let layer = null;
                switch (type) {
                    case "Point":
                        layer = layerList.createLayer(fileName, Module.ELT_3DPOINT);
                        break;
                    case "LineString":
                    case "MultiLineString":
                        layer = layerList.createLayer(fileName, Module.ELT_3DLINE);
                        break;
                    case "Polygon":
                    case "MultiPolygon":
                        layer = layerList.createLayer(fileName, Module.ELT_POLYHEDRON);
                        break;
                    default:
                        alert("지원하지 않는 geometry type: " + type);
                        return;
                }

                // 레이어 객체 선택 활성화
                if (layer && typeof layer.setSelectable === 'function') {
                    layer.setSelectable(true);
                    console.log('레이어 선택 이벤트 활성화:', fileName);
                }

                // 모든 타입에 랜덤 색상 적용
                const randomColor = 'rgba(' + Math.floor(Math.random() * 256) + ',' +
                    Math.floor(Math.random() * 256) + ',' +
                    Math.floor(Math.random() * 256) + ', 1.0)';

                // 폴리곤용 라인 색상 (더 어두운 색상)
                const strokeColor = 'rgba(' + Math.floor(Math.random() * 200) + ',' +
                    Math.floor(Math.random() * 200) + ',' +
                    Math.floor(Math.random() * 200) + ', 1.0)';

                switch (type) {
                    case "Point":
                        createPointObjects(layer, data.features, 0.0, randomColor);
                        break;
                    case "LineString":
                    case "MultiLineString":
                        createLineObjects(layer, data.features, 0.0, randomColor, 3.0);
                        break;
                    case "Polygon":
                    case "MultiPolygon":
                        createPolygonObjects(layer, data.features, 0.0, randomColor, strokeColor);
                        // 단면도 분석용 폴리곤 데이터 저장
                        window.slicePolygonData = window.slicePolygonData || {};
                        window.slicePolygonData[fileName] = data.features;
                        break;
                }
                // 새 레이어 UI 생성
                const layerContainer = document.createElement('div');
                layerContainer.className = 'layer-item-container';

                const layerHeader = document.createElement('div');
                layerHeader.className = 'layer-item-header';

                // 속성 패널용 컨테이너 (별도로 저장)
                const propertiesContainer = document.createElement('div');
                propertiesContainer.className = 'layer-item-properties';

                // 체크박스
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = true;
                checkbox.addEventListener('change', () => {
                    layer.setVisible(checkbox.checked);
                });

                // geometry 타입에 따른 아이콘 (원본 색상 사용, 투명도 0으로 시작)
                let iconElement = null;
                if (type === "Point") {
                    const iconUrl = getMarkerIcon(fileName, randomColor, true, 0, 0);
                    iconElement = document.createElement('img');
                    iconElement.src = iconUrl;
                    iconElement.style.width = '24px';
                    iconElement.style.height = '24px';
                } else if (type === "LineString" || type === "MultiLineString") {
                    const iconUrl = getMarkerIcon(fileName, randomColor, true, 1, 0);
                    iconElement = document.createElement('img');
                    iconElement.src = iconUrl;
                    iconElement.style.width = '24px';
                    iconElement.style.height = '24px';
                } else if (type === "Polygon" || type === "MultiPolygon") {
                    // 폴리곤은 면 색상/투명도와 선 색상/투명도를 모두 전달
                    const iconUrl = getMarkerIcon(fileName, randomColor, true, 2, 0, strokeColor, 0);
                    iconElement = document.createElement('img');
                    iconElement.src = iconUrl;
                    iconElement.style.width = '24px';
                    iconElement.style.height = '24px';
                }

                moveToLayer(layer)

                // 원본 레이어 이름 저장 (레이어 제거용)
                const originalLayerName = fileName;

                // 레이어 이름
                const label = document.createElement('span');
                label.textContent = fileName;
                label.title = fileName;
                label.style.cursor = 'pointer';

                // 클릭 이벤트 - 레이어로 이동
                label.addEventListener('click', () => {
                    moveToLayer(layer);
                });

                // x 제거 버튼
                const removeBtn = document.createElement('button');
                removeBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4L4 12M4 4L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
                removeBtn.title = `${originalLayerName} 레이어를 삭제합니다`;
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    Module.XDEMapRemoveLayer(originalLayerName);
                    dropSqliteTable(fileName);
                    if (window.slicePolygonData) delete window.slicePolygonData[originalLayerName];
                    layerContainer.remove();
                    mouseOverInterface(false);
                });

                // RGB를 hex로 변환하는 함수
                function rgbaToHex(rgba) {
                    const rgb = colorStringToRGB(rgba);
                    return '#' + rgb.map(x => x.toString(16).padStart(2, '0')).join('');
                }

                // hex를 rgba로 변환하는 함수
                function hexToRgba(hex) {
                    const r = parseInt(hex.substr(1, 2), 16);
                    const g = parseInt(hex.substr(3, 2), 16);
                    const b = parseInt(hex.substr(5, 2), 16);
                    return `rgba(${r}, ${g}, ${b}, 1.0)`;
                }

                // 색상 피커 및 컨트롤 변수들
                let pointColorPicker, lineColorPicker, lineWidthInput, fillColorPicker, strokeColorPicker, iconSelect;
                let pointColorCode, lineColorCode, fillColorCode, strokeColorCode;

                // 헬퍼 함수: 레이어 재생성
                function recreateLayer(layerType, createFunction) {
                    console.log('레이어 재생성:', originalLayerName);
                    Module.XDEMapRemoveLayer(originalLayerName);
                    const layerList = new Module.JSLayerList(true);
                    layer = layerList.createLayer(originalLayerName, layerType);
                    layer.setVisible(checkbox.checked);
                    createFunction();
                    layer.rebuildObjectLayer();
                }

                // 헬퍼 함수: 아이콘 업데이트
                function updateIcon(iconType, color, transparency = 0, strokeColor = null, strokeTransparency = 0) {
                    console.log('아이콘 업데이트:', iconType, color);
                    if (iconElement) {
                        const iconUrl = getMarkerIcon(originalLayerName, color, true, iconType, transparency, strokeColor, strokeTransparency);
                        iconElement.src = iconUrl;
                        console.log('아이콘 URL 업데이트 완료');
                    }
                }

                // 점 타입 - 아이콘 선택 및 색상 피커

                let currentPointSize = 10;
                let pointSizeInput;
                if (type === "Point") {
                    // 색상 피커 생성 (원본 색상 사용)
                    pointColorPicker = document.createElement('input');
                    pointColorPicker.type = 'color';
                    pointColorPicker.value = rgbaToHex(randomColor);
                    pointColorPicker.className = 'color-picker';
                    pointColorPicker.title = '점 색상';

                    // 점 색상 hex 코드 표시
                    pointColorCode = document.createElement('span');
                    pointColorCode.className = 'color-code';
                    pointColorCode.textContent = pointColorPicker.value.toUpperCase();

                    // 아이콘 선택 드롭다운
                    iconSelect = document.createElement('select');
                    iconSelect.className = 'icon-select';
                    iconSelect.title = 'POI 아이콘 선택';
                    iconSelect.innerHTML = `
                        <option value="circle">● 원형</option>
                        <option value="pin">📍 핀</option>
                        <option value="star">⭐ 별</option>
                        <option value="home">🏠 집</option>
                        <option value="flag">🚩 깃발</option>
                    `;

                    // 점 크기 슬라이더
                    pointSizeInput = document.createElement('input');
                    pointSizeInput.type = 'range';
                    pointSizeInput.min = '1';
                    pointSizeInput.max = '50';
                    pointSizeInput.value = currentPointSize;
                    pointSizeInput.className = 'size-slider';
                    pointSizeInput.title = '점 크기';

                    // 색상 피커 이벤트 핸들러
                    pointColorPicker.addEventListener('change', (e) => {
                        const newColor = hexToRgba(e.target.value);
                        pointColorCode.textContent = e.target.value.toUpperCase();

                        recreateLayer(Module.ELT_3DPOINT, () => {

                                createPointObjects(layer, data.features, 0.0, newColor, null, currentPointSize);
                            } else {

                                createPointObjects(layer, data.features, 0.0, newColor, iconUrl, currentPointSize);

                        });

                        // 레이어 리스트 아이콘도 업데이트

                            iconElement.src = currentIconType === 'circle'
                                ? getMarkerIcon(fileName, newColor, true, 0)
                                : createColoredIconUrl(currentIconType, e.target.value);

                    });

                    // 아이콘 선택 이벤트 핸들러
                    iconSelect.addEventListener('change', (e) => {

                        recreateLayer(Module.ELT_3DPOINT, () => {

                            }
                        });

                        // 레이어 리스트 아이콘도 업데이트
                        if (iconElement) {
                            iconElement.src = currentIconType === 'circle'
                                ? getMarkerIcon(fileName, currentColor, true, 0)
                                : createColoredIconUrl(currentIconType, pointColorPicker.value);

                    });

                    // 점 크기 슬라이더 이벤트 핸들러
                    pointSizeInput.addEventListener('input', (e) => {
                        currentPointSize = parseFloat(e.target.value) || 10;

                        const currentColor = hexToRgba(pointColorPicker.value);

                        recreateLayer(Module.ELT_3DPOINT, () => {
                            if (currentIconType === 'circle') {
                                createPointObjects(layer, data.features, 0.0, currentColor, null, currentPointSize);
                            } else {
                                const iconUrl = createColoredIconUrl(currentIconType, pointColorPicker.value);
                                createPointObjects(layer, data.features, 0.0, currentColor, iconUrl, currentPointSize);
                            }
                        });
                    });
                }

                // 라인 타입 색상 피커 및 두께 컨트롤
                let currentLineWidth = 3.0;
                let currentLineTransparency = 0;
                let lineTransparencyInput;
                if (type === "LineString" || type === "MultiLineString") {
                    lineColorPicker = document.createElement('input');
                    lineColorPicker.type = 'color';
                    lineColorPicker.value = rgbaToHex(randomColor);

                    lineWidthInput.style.padding = '2px 4px';

                    lineWidthInput.addEventListener('change', (e) => {

        function moveToLayer(layer) {
            try {
                let obj = layer.indexAtObject(0);
                if (!obj || !obj.position) {
                    console.warn('레이어에 객체가 없거나 위치 정보가 없습니다.');
                    return;
